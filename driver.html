<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Driver</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --dark: #064f3b;
      --green: #087455;
      --blue: #2f7be7;
      --orange: #e7862f;
      --yellow: #c6a000;
      --purple: #7f47de;
      --dark-purple: #4a2b8a;
      --gray: #7b8791;
      --light-green: #e7f5ef;
      --coral: #ff665c;
      --background: #f6faf8;
      --white: #ffffff;
      --ink: #17221e;
      --muted: #68756f;
      --line: #dfe8e4;
      --danger: #a32d2d;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--dark);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.08;
    }

    .brand span {
      color: var(--coral);
    }

    .driver-email {
      margin-top: 6px;
      font-size: 12px;
      opacity: .82;
      overflow-wrap: anywhere;
    }

    .signout {
      border: 0;
      border-radius: 14px;
      padding: 14px 17px;
      background: white;
      color: var(--dark);
      font-weight: 900;
      min-width: 108px;
    }

    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 28px 18px 60px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 42px;
      line-height: 1.05;
    }

    h2 {
      margin: 0;
      font-size: 28px;
    }

    .earnings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 13px;
      margin-bottom: 24px;
    }

    .earning-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 19px;
      padding: 19px;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }

    .earning-amount {
      color: var(--green);
      font-size: 29px;
      font-weight: 900;
    }

    .earning-label {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .refresh {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      background: white;
      color: var(--dark);
      font-weight: 800;
    }

    .route-button {
      border: 1px solid #cfe1da;
      border-radius: 12px;
      padding: 11px 14px;
      background: #edf7f3;
      color: var(--dark);
      font-weight: 800;
    }

    .next-stop-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, .05);
      margin-bottom: 10px;
    }

    .next-stop-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .next-stop-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .next-stop-main {
      min-width: 0;
    }

    .next-stop-type {
      font-size: 11px;
      font-weight: 900;
      color: var(--green);
      text-transform: uppercase;
    }

    .next-stop-job {
      font-size: 18px;
      font-weight: 900;
      color: var(--dark);
      margin-top: 2px;
    }

    .next-stop-city {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-stop-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .next-stop-expand,
    .next-stop-nav,
    .next-stop-open {
      border: 1px solid var(--line);
      background: white;
      color: var(--dark);
      min-height: 38px;
      padding: 8px 11px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .next-stop-nav {
      background: #edf7f3;
      border-color: #cfe1da;
    }

    .next-stop-details {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 9px;
      display: grid;
      gap: 8px;
    }

    .next-stop-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .route-modal-sheet {
      position: relative;
      background: white;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
      animation: modalUp .22s ease-out;
    }

    .route-helper {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .route-list {
      display: grid;
      gap: 8px;
    }

    .route-stop {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fbfdfc;
      cursor: pointer;
    }

    .route-stop-index {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #edf7f3;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .route-stop-type {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .route-stop-job {
      color: var(--dark);
      font-size: 15px;
      font-weight: 900;
      margin-top: 1px;
    }

    .route-stop-place,
    .route-stop-distance {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .toast-wrap {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 120;
      display: grid;
      gap: 8px;
      width: min(92vw, 420px);
      pointer-events: none;
    }

    .toast {
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.35;
      color: white;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(6px);
      animation: toastIn .18s ease-out forwards;
    }

    .toast.success { background: #0c7f5c; }
    .toast.error { background: #9e2f2f; }
    .toast.info { background: #355a8a; }

    @keyframes toastIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .job-list {
      display: grid;
      gap: 10px;
    }

    .compact-job {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      min-height: 102px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 7px;
      cursor: pointer;
    }

    .compact-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .compact-job-number {
      color: var(--dark);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .compact-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status {
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--light-green);
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .status-new,
    .status-assigned,
    .status-accepted {
      background: #e8f8ee;
      color: var(--green);
    }

    .status-en-route-pickup {
      background: #e9f1ff;
      color: var(--blue);
    }

    .status-at-pickup {
      background: #fff2e5;
      color: var(--orange);
    }

    .status-picked-up {
      background: #fff8dc;
      color: var(--yellow);
    }

    .status-en-route-delivery {
      background: #f1eaff;
      color: var(--purple);
    }

    .status-at-delivery {
      background: #ece5ff;
      color: var(--dark-purple);
    }

    .status-delivered {
      background: #f0f3f5;
      color: var(--gray);
    }

    .new-badge {
      border-radius: 999px;
      padding: 6px 10px;
      background: #ff665c;
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .compact-route {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compact-stop {
      font-size: 13px;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-customer {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .compact-arrow {
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
    }

    .compact-chevron {
      color: #8ea09a;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
    }

    .compact-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .compact-speed {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .compact-pay {
      color: var(--green);
      font-weight: 900;
      font-size: 18px;
      margin-top: 2px;
    }

    .job-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      align-items: end;
    }

    .job-modal[hidden] {
      display: none;
    }

    .job-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .45);
    }

    .job-modal-sheet {
      position: relative;
      background: white;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
      animation: modalUp .22s ease-out;
    }

    @keyframes modalUp {
      from {
        transform: translateY(18px);
        opacity: .55;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .job-modal-close {
      border: 1px solid var(--line);
      background: white;
      color: var(--dark);
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-weight: 900;
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .modal-title {
      margin: 2px 52px 6px 0;
      color: var(--dark);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
    }

    .modal-status-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .modal-pay {
      margin: 14px 0 4px;
      color: var(--green);
      font-size: 30px;
      font-weight: 900;
    }

    .modal-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .modal-item {
      background: #f8fcfa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
    }

    .modal-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-value {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .modal-section-title {
      color: var(--dark);
      font-size: 16px;
      font-weight: 900;
      margin-top: 16px;
      margin-bottom: 9px;
    }

    .modal-divider-arrow {
      color: var(--green);
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      margin: 5px 0;
    }

    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .modal-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .action {
      border: 0;
      border-radius: 13px;
      min-height: 48px;
      padding: 11px 14px;
      font-weight: 900;
    }

    .directions {
      background: #edf3f0;
      color: var(--dark);
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .photo-button {
      background: #eef7ff;
      color: #135a82;
    }

    .action:disabled {
      opacity: .48;
      cursor: default;
    }

    .photo-area {
      margin-top: 15px;
      border: 1px dashed #b9c9c2;
      border-radius: 14px;
      padding: 14px;
      background: #fafdfb;
    }

    .photo-area img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 11px;
      margin-top: 11px;
    }

    .photo-status {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .delivery-options {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 1px solid #ccd8d3;
      border-radius: 12px;
      background: white;
      color: var(--ink);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .message {
      margin-top: 14px;
      padding: 13px;
      border-radius: 11px;
      line-height: 1.4;
    }

    .message.info {
      background: #edf7f3;
      color: #06543e;
    }

    .message.error {
      background: #fff0f0;
      color: var(--danger);
    }

    .empty {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .history-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 17px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .history-pay {
      color: var(--green);
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
    }

    .history-date {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .job-number {
      color: var(--dark);
      font-size: 23px;
      font-weight: 900;
    }

    body.modal-open {
      overflow: hidden;
    }

    @media (max-width: 650px) {
      .earnings {
        grid-template-columns: 1fr;
      }

      .workflow-grid,
      .button-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

      .compact-job {
        min-height: 96px;
      }

      .compact-job-number {
        font-size: 22px;
      }
    }

    @media (min-width: 760px) {
      .job-modal {
        align-items: center;
        justify-items: center;
      }

      .job-modal-sheet {
        width: min(700px, calc(100% - 40px));
        max-height: 88vh;
        border-radius: 18px;
      }

      .route-modal-sheet {
        width: min(640px, calc(100% - 40px));
        max-height: 86vh;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div>
      <div class="brand">MG <span>EXPRESS</span> DRIVER</div>
      <div class="driver-email" id="driverEmail"></div>
    </div>

    <button class="signout" id="signOutButton" type="button">
      Sign Out
    </button>
  </header>

  <main class="container">
    <div class="eyebrow" id="welcomeText">Driver mobile portal</div>
    <h1>My Jobs</h1>

    <section class="earnings">
      <div class="earning-card">
        <div class="earning-amount" id="todayEarnings">$0.00</div>
        <div class="earning-label">Today's Pay</div>
      </div>

      <div class="earning-card">
        <div class="earning-amount" id="weekEarnings">$0.00</div>
        <div class="earning-label">This Week's Pay</div>
      </div>

      <div class="earning-card">
        <div class="earning-amount" id="activeCount">0</div>
        <div class="earning-label">Active Jobs</div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Assigned Jobs</h2>

        <div class="section-actions">
          <button class="route-button" id="viewRouteButton" type="button">
            View Suggested Route
          </button>

          <button class="refresh" id="refreshButton" type="button">
            Refresh
          </button>
        </div>
      </div>

      <div id="nextSuggestedStop"></div>

      <div id="activeJobs" class="job-list">
        <div class="empty">Loading assigned jobs…</div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Completed Jobs</h2>
      </div>

      <div id="completedJobs" class="job-list">
        <div class="empty">Loading completed jobs…</div>
      </div>
    </section>
  </main>

  <div id="jobModal" class="job-modal" hidden>
    <div id="jobModalBackdrop" class="job-modal-backdrop"></div>

    <div class="job-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
      <button id="jobModalClose" class="job-modal-close" type="button" aria-label="Close job details">
        X
      </button>

      <div id="jobModalContent"></div>
    </div>
  </div>

  <div id="routeModal" class="job-modal" hidden>
    <div id="routeModalBackdrop" class="job-modal-backdrop"></div>

    <div class="route-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="routeModalTitle">
      <button id="routeModalClose" class="job-modal-close" type="button" aria-label="Close suggested route">
        X
      </button>

      <h3 id="routeModalTitle" class="modal-title">Suggested Route</h3>
      <p class="route-helper">Suggested order only. You may complete stops in any order.</p>
      <div id="routeModalList" class="route-list"></div>
    </div>
  </div>

  <div id="toastWrap" class="toast-wrap"></div>

  <script>
    const client = supabase.createClient(
  "https://dczlucwfjayymlwbzzdi.supabase.co",
  "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
);

window.mgSupabaseClient = client;

    const activeJobsBox = document.getElementById("activeJobs");
    const nextSuggestedStopBox = document.getElementById("nextSuggestedStop");
    const completedJobsBox = document.getElementById("completedJobs");
    const jobModal = document.getElementById("jobModal");
    const jobModalContent = document.getElementById("jobModalContent");
    const jobModalBackdrop = document.getElementById("jobModalBackdrop");
    const jobModalClose = document.getElementById("jobModalClose");
    const routeModal = document.getElementById("routeModal");
    const routeModalBackdrop = document.getElementById("routeModalBackdrop");
    const routeModalClose = document.getElementById("routeModalClose");
    const routeModalList = document.getElementById("routeModalList");
    const viewRouteButton = document.getElementById("viewRouteButton");
    const toastWrap = document.getElementById("toastWrap");

    let currentSession = null;
    let driver = null;
    let jobs = [];
    let selectedJobId = null;
    let selectedJob = null;
    let modalBusy = false;
    let pendingPhotoButton = null;
    let nextStopExpanded = false;

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    function money(value) {
      return Number(value || 0).toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
    }

    function statusLabel(status) {
      const labels = {
        assigned: "Assigned",
        accepted: "Accepted",
        en_route_pickup: "En Route to Pickup",
        arrived_pickup: "At Pickup",
        en_route_delivery: "En Route to Delivery",
        arrived_delivery: "At Delivery",
        arrived_at_pickup: "Arrived at Pickup",
        en_route_to_pickup: "En Route to Pickup",
        picked_up: "Picked Up",
        arrived_at_delivery: "Arrived at Delivery",
        en_route_to_delivery: "En Route to Delivery",
        new: "Assigned",
        waiting_payment: "Waiting",
        paid: "Ready",
        ready: "Ready",
        in_transit: "In Transit",
        delivered: "Delivered",
        cancelled: "Cancelled"
      };

      return labels[status] ||
        String(status || "").replaceAll("_", " ");
    }

    function normalizeJobStatus(job) {
      const workflowStatus = String(job?.driver_workflow_status || "").toLowerCase();
      const rawStatus = String(job?.status || "assigned").toLowerCase();
      const source = workflowStatus || rawStatus;

      if (source === "new") return "assigned";
      if (source === "in_transit") return "en_route_to_delivery";
      if (source === "en_route_pickup") return "en_route_to_pickup";
      if (source === "arrived_pickup") return "arrived_at_pickup";
      if (source === "en_route_delivery") return "en_route_to_delivery";
      if (source === "arrived_delivery") return "arrived_at_delivery";

      return source;
    }

    function hasAccepted(job) {
      return String(job.driver_acceptance_status || "").toLowerCase() === "accepted";
    }

    function formatDate(value) {
      if (!value) return "";

      return new Date(value).toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function beginningOfToday() {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function beginningOfWeek() {
      const date = beginningOfToday();
      const day = date.getDay();
      const difference = day === 0 ? 6 : day - 1;
      date.setDate(date.getDate() - difference);
      return date;
    }

    function beginningOfMonth() {
      const date = beginningOfToday();
      date.setDate(1);
      return date;
    }

    function completedDate(job) {
      return new Date(job.completed_at || job.created_at);
    }

    function updateEarnings() {
      const delivered = jobs.filter(job => job.status === "delivered");

      const totalSince = start =>
        delivered
          .filter(job => completedDate(job) >= start)
          .reduce((sum, job) => sum + Number(job.driver_pay || 0), 0);

      document.getElementById("todayEarnings").textContent =
        money(totalSince(beginningOfToday()));

      document.getElementById("weekEarnings").textContent =
        money(totalSince(beginningOfWeek()));

      document.getElementById("activeCount").textContent =
        jobs.filter(job =>
          !["delivered", "cancelled"].includes(job.status)
        ).length;
    }

    function mapLink(address) {
      return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address || "");
    }

    function mapDirectionsLink(address) {
      return "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(address || "");
    }

    function fieldValue(job, keys) {
      for (const key of keys) {
        const value = job?.[key];

        if (value !== null && value !== undefined && String(value).trim() !== "") {
          return String(value).trim();
        }
      }

      return "";
    }

    function shortAddress(address) {
      const value = String(address || "").trim();
      if (!value) return "Address not available";

      const compact = value
        .split(",")
        .map(part => part.trim())
        .filter(Boolean)
        .slice(0, 2)
        .join(", ");

      if (compact.length <= 34) return compact;
      return compact.slice(0, 31) + "...";
    }

    function locationSummary(job, prefix) {
      const city = fieldValue(job, [
        prefix + "_city",
        prefix + "City"
      ]);

      if (city) return city;

      return shortAddress(job[prefix + "_address"]);
    }

    function scheduledTimestamp(job) {
      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at",
        "created_at"
      ]);

      const value = source ? Date.parse(source) : 0;
      return Number.isFinite(value) ? value : 0;
    }

    function deliverySpeedOrTime(job) {
      if (job.delivery_speed) {
        return String(job.delivery_speed);
      }

      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at"
      ]);

      if (source) {
        return "Scheduled " + formatDate(source);
      }

      return "Standard";
    }

    function routeStopType(job) {
      const status = normalizeJobStatus(job);
      const deliveryStates = [
        "picked_up",
        "en_route_to_delivery",
        "arrived_at_delivery",
        "delivered"
      ];

      return deliveryStates.includes(status) ? "DELIVERY" : "PICKUP";
    }

    function routeDestinationAddress(job) {
      const stopType = routeStopType(job);
      const prefix = stopType === "DELIVERY" ? "delivery" : "pickup";

      const address = fieldValue(job, [
        prefix + "_address"
      ]);

      const city = fieldValue(job, [
        prefix + "_city",
        prefix + "City"
      ]);

      const state = fieldValue(job, [
        prefix + "_state",
        prefix + "State"
      ]);

      const zip = fieldValue(job, [
        prefix + "_zip",
        prefix + "_postal_code",
        prefix + "_postcode"
      ]);

      return [address, city, state, zip]
        .filter(Boolean)
        .join(", ");
    }

    function routePriority(job) {
      const status = normalizeJobStatus(job);

      if (["en_route_to_pickup", "arrived_at_pickup"].includes(status)) {
        return 1;
      }

      if (
        (status === "assigned" && acceptancePending(job)) ||
        status === "accepted" ||
        (status === "assigned" && hasAccepted(job))
      ) {
        return 2;
      }

      if (["picked_up", "en_route_to_delivery", "arrived_at_delivery"].includes(status)) {
        return 3;
      }

      return 4;
    }

    function buildSuggestedRouteStops() {
      return jobs
        .filter(job => {
          const status = normalizeJobStatus(job);
          const acceptance = String(job.driver_acceptance_status || "").toLowerCase();

          return !["delivered", "cancelled"].includes(status) && acceptance !== "rejected";
        })
        .sort((left, right) => {
          const p = routePriority(left) - routePriority(right);
          if (p !== 0) return p;

          const pickupDiff = scheduledTimestamp(left) - scheduledTimestamp(right);
          if (pickupDiff !== 0) return pickupDiff;

          const createdDiff = (Date.parse(left.created_at || 0) || 0) - (Date.parse(right.created_at || 0) || 0);
          if (createdDiff !== 0) return createdDiff;

          return String(left.job_number || "").localeCompare(String(right.job_number || ""));
        })
        .map((job, index, arr) => {
          const stopType = routeStopType(job);
          const destination = routeDestinationAddress(job);
          const city = locationSummary(job, stopType === "DELIVERY" ? "delivery" : "pickup");

          const currentZipRaw = fieldValue(job, [
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_zip",
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_postal_code",
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_postcode"
          ]);

          const prev = arr[index - 1];
          const prevType = prev ? routeStopType(prev) : null;
          const prevZipRaw = prev
            ? fieldValue(prev, [
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_zip",
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_postal_code",
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_postcode"
              ])
            : "";

          const currentZip = Number(String(currentZipRaw).replace(/\D/g, ""));
          const previousZip = Number(String(prevZipRaw).replace(/\D/g, ""));
          const hasEstimate = Number.isFinite(currentZip) && Number.isFinite(previousZip) && currentZip > 0 && previousZip > 0;
          const distance = hasEstimate
            ? (Math.max(1, Math.abs(currentZip - previousZip) / 18) + 0.8).toFixed(1) + " miles away"
            : "Distance estimate unavailable";

          return {
            index: index + 1,
            jobId: job.id,
            jobNumber: job.job_number,
            stopType,
            city,
            destination,
            distance,
            job
          };
        });
    }

    function selectNextSuggestedStop() {
      const stops = buildSuggestedRouteStops();
      return stops[0] || null;

    function usesDriverWorkflowStatus(job = null) {
      if (job && Object.prototype.hasOwnProperty.call(job, "driver_workflow_status")) {

      }

      return jobs.some(item =>

      );

    function podRecipientField(job) {
      if (Object.prototype.hasOwnProperty.call(job, "pod_recipient_name")) {
        return "pod_recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "recipient_name")) {
        return "recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "delivery_recipient_name")) {

      }

    function podRecipientValue(job) {

    function acceptancePending(job) {
      const value = String(job.driver_acceptance_status || "").toLowerCase();
      return !value || value === "pending";
    }

    function workflowState(job) {
      const status = normalizeJobStatus(job);

      if (status === "assigned" && acceptancePending(job)) {
        return "pending";
      }

      if (status === "assigned" && hasAccepted(job)) {
        return "accepted";
      }

      if (status === "en_route_to_pickup") return "driving_to_pickup";
      if (status === "arrived_at_pickup") return "arrived_pickup";
      if (status === "picked_up") return "picked_up";
      if (status === "en_route_to_delivery") return "driving_to_delivery";
      if (status === "arrived_at_delivery") return "arrived_delivery";
      if (status === "delivered") return "delivered";

      return "other";
    }

    function statusBadgeClass(job) {
      const status = normalizeJobStatus(job);

      if (status === "assigned" && acceptancePending(job)) return "status-new";
      if (status === "assigned" && hasAccepted(job)) return "status-accepted";
      if (status === "en_route_to_pickup") return "status-en-route-pickup";
      if (status === "arrived_at_pickup") return "status-at-pickup";
      if (status === "picked_up") return "status-picked-up";
      if (status === "en_route_to_delivery") return "status-en-route-delivery";
      if (status === "arrived_at_delivery") return "status-at-delivery";
      if (status === "delivered") return "status-delivered";

      return "status-assigned";
    }

      if (status === "en_route_to_pickup") return "EN ROUTE TO PICKUP";
      if (status === "arrived_at_pickup") return "AT PICKUP";
      if (status === "picked_up") return "PICKED UP";
      if (status === "en_route_to_delivery") return "EN ROUTE TO DELIVERY";
      if (status === "arrived_at_delivery") return "AT DELIVERY";
      if (status === "delivered") return "DELIVERED";

          <div class="modal-item"><div class="modal-label">Address</div><div class="modal-value">${escapeHtml(safeText(job.delivery_address))}</div></div>
          <div class="modal-item"><div class="modal-label">Suite/Floor</div><div class="modal-value">${escapeHtml(safeText(deliverySuite))}</div></div>
          <div class="modal-item"><div class="modal-label">ZIP</div><div class="modal-value">${escapeHtml(safeText(deliveryZip))}</div></div>
          <div class="modal-item"><div class="modal-label">Recipient</div><div class="modal-value">${escapeHtml(safeText(podRecipientValue(job)))}</div></div>
          <div class="modal-item"><div class="modal-label">Delivery Notes</div><div class="modal-value">${escapeHtml(safeText(deliveryNotes))}</div></div>
        </div>

        <div class="modal-divider-arrow">↓</div>

        <div class="modal-label">Driver Pay</div>
        <div class="modal-pay">${money(job.driver_pay)}</div>

        <div class="modal-divider-arrow">↓</div>

        <div class="modal-label">Current Status</div>
        <div class="modal-status-row">
          <div class="status ${statusBadgeClass(job)}">${escapeHtml(cardWorkflowLabel(job))}</div>
        </div>

        <div class="modal-section-title">Actions</div>
        <div class="button-grid">
          <button class="action directions" type="button" onclick="navigateForJob('${job.id}')">📍 Navigate</button>
          ${pickupPhone ? `<button class="action directions" type="button" onclick="window.location.href='tel:${escapeHtml(pickupPhone)}'">Call Pickup</button>` : ""}
          ${customerPhone ? `<button class="action directions" type="button" onclick="window.location.href='tel:${escapeHtml(customerPhone)}'">Call Customer</button>` : ""}
        </div>

        ${state !== "delivered" ? `
          <div class="modal-section-title">Workflow</div>
          <div class="workflow-grid">
            ${workflowButtonsInModal(job)}
          </div>
        ` : '<div class="modal-note">Delivered job: workflow complete.</div>'}

        <div class="modal-section-title">Pickup Photo</div>
        ${photoInput(job.id, "pickup")}
        ${showPickupControls ? `
          <div class="button-grid">
            <button class="action photo-button" type="button" onclick="openPhotoPicker('${job.id}','pickup',this)">
              ${job.pickup_photo_url ? "Replace Pickup Photo" : "Take Pickup Photo"}
            </button>
          </div>
        ` : ""}
        ${renderPhotoArea(job, "pickup")}

        <div class="modal-section-title">Delivery Photo</div>
        ${photoInput(job.id, "delivery")}
        ${showDeliveryControls ? `
          <div class="button-grid">
            <button class="action photo-button" type="button" onclick="openPhotoPicker('${job.id}','delivery',this)">
              ${job.delivery_photo_url ? "Replace Delivery Photo" : "Take Delivery Photo"}
            </button>
          </div>
        ` : ""}

        ${showDeliveryProof ? `
          <div class="delivery-options">
            <label>
              Recipient Name
              <input
                id="podRecipientModal-${job.id}"
                type="text"
                value="${escapeHtml(podRecipientValue(job))}"
                placeholder="Enter recipient name if no delivery photo"
              >
            </label>
          </div>
        ` : ""}

        ${renderPhotoArea(job, "delivery")}

        ${showDeliveryProof ? '<div class="modal-note">Complete delivery requires delivery photo or recipient name.</div>' : ""}

        <div id="message-${job.id}"></div>
      `;
    }

    function openJobDetails(jobId) {
      const job = getSelectedJob(jobId);
      if (!job) return;

      if (selectedJobId && selectedJobId !== jobId) {
        jobModalContent.innerHTML = "";
      }

      selectedJobId = jobId;
      selectedJob = job;
      renderJobDetailsModal(job);
      jobModal.hidden = false;
      document.body.classList.add("modal-open");
    }

    window.openJobDetails = openJobDetails;

    function closeJobDetails(force = false) {
      if (modalBusy && !force) return;

      selectedJobId = null;
      selectedJob = null;
      jobModal.hidden = true;
      document.body.classList.remove("modal-open");
      jobModalContent.innerHTML = "";
    }

    function setModalBusy(isBusy) {
      modalBusy = isBusy;

      if (jobModal) {
        jobModal.setAttribute("aria-busy", String(isBusy));
      }
    }

    function activeJobsSorted() {
      return jobs
        .filter(job => {
          const status = normalizeJobStatus(job);
          const acceptance = String(job.driver_acceptance_status || "").toLowerCase();

          return !["delivered", "cancelled"].includes(status) && acceptance !== "rejected";
        })
        .sort((left, right) => {
          const leftCreated = Date.parse(left.created_at || 0) || 0;
          const rightCreated = Date.parse(right.created_at || 0) || 0;
          return rightCreated - leftCreated;
        });
    }

    function renderJobs() {
      updateEarnings();

      const active = activeJobsSorted();
      renderNextSuggestedStopCard();

      const completed = jobs
        .filter(job => normalizeJobStatus(job) === "delivered")
        .slice(0, 30);

      activeJobsBox.innerHTML = active.length
        ? active.map(compactJobCard).join("")
        : '<div class="empty">No active jobs are currently assigned.</div>';

      completedJobsBox.innerHTML = completed.length
        ? completed.map(job => `
            <article class="history-card">
              <div class="history-row">
                <div>
                  <div class="job-number">
                    ${escapeHtml(job.job_number)}
                  </div>

                  <div>
                    ${escapeHtml(job.customer_name || "Customer")}
                  </div>

                  <div class="history-date">
                    ${escapeHtml(formatDate(job.completed_at))}
                  </div>
                </div>

                <div class="history-pay">
                  ${money(job.driver_pay)}
                </div>
              </div>
            </article>
          `).join("")
        : '<div class="empty">No completed jobs yet.</div>';
    }

    function showJobMessage(jobId, text, type) {
      const box = document.getElementById("message-" + jobId);

      if (!box) {
        if (text && type === "error") {
          showToast(text, "error");
        }

        return;
      }

      box.className = "message " + type;
      box.textContent = text;

      if (text && type === "error") {
        showToast(text, "error");
      }
    }

    async function verifyDriver() {
      const sessionResult = await client.auth.getSession();
      currentSession = sessionResult.data.session;

      if (!currentSession) {
        location.replace("/index.html");
        return false;
      }

      document.getElementById("driverEmail").textContent =
        currentSession.user.email || "";

      const profileResult = await client
        .from("profiles")
        .select("role,full_name")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      const role = String(
        profileResult.data?.role || ""
      ).toLowerCase();

      if (role !== "driver") {
        await client.auth.signOut();
        location.replace("/index.html");
        return false;
      }

      const driverResult = await client
        .from("drivers")
        .select("id,full_name,email,active")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      if (driverResult.error || !driverResult.data) {
        alert(
          driverResult.error?.message ||
          "No driver record was found for this account."
        );

        return false;
      }

      driver = driverResult.data;
      window.dispatchEvent(
  new CustomEvent("mg-driver-ready", {
    detail: {
      name: driver.full_name,
      email: driver.email
    }
  })
);

      document.getElementById("welcomeText").textContent =
        "Welcome, " + (driver.full_name || "Driver");

      return true;
    }

    async function loadJobs() {
      activeJobsBox.innerHTML =
        '<div class="empty">Loading assigned jobs…</div>';

      const result = await client
        .from("quotes")
        .select("*")
        .eq("assigned_driver_id", driver.id)
        .order("created_at", { ascending: false });

      if (result.error) {
        activeJobsBox.innerHTML =
          `<div class="message error">${escapeHtml(result.error.message)}</div>`;

        return;
      }

      jobs = result.data || [];
      renderJobs();

      if (selectedJobId) {
        const current = getSelectedJob(selectedJobId);
        const isRejected = String(current?.driver_acceptance_status || "").toLowerCase() === "rejected";
        const isDelivered = normalizeJobStatus(current) === "delivered";

        if (!current || isRejected || isDelivered) {
          closeJobDetails(true);
        } else {
          renderJobDetailsModal(current);
        }
      }
    }

    async function uploadPhoto(jobId, type, input) {
      const selectedJob = getSelectedJob(jobId);
      if (!selectedJob?.id) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      const file = input.files?.[0];

      if (!file) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        return;
      }

      if (!file.type.startsWith("image/")) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(jobId, "Please choose an image.", "error");
        return;
      }

      setModalBusy(true);
      showJobMessage(jobId, "Uploading photo…", "info");

      const extension =
        file.name.split(".").pop()?.toLowerCase() || "jpg";

      const path =
        driver.id + "/" +
        jobId + "/" +
        type + "-" +
        Date.now() + "." +
        extension;

      const uploadResult = await client.storage
        .from("delivery-photos")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadResult.error) {
        setModalBusy(false);
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(
          jobId,
          uploadResult.error.message,
          "error"
        );

        return;
      }

      const publicResult = client.storage
        .from("delivery-photos")
        .getPublicUrl(path);

      const publicUrl = publicResult.data.publicUrl;

      const updateData = type === "pickup"
        ? {
            pickup_photo_url: publicUrl,
            pickup_photo_uploaded_at: new Date().toISOString()
          }
        : {
            delivery_photo_url: publicUrl,
            delivery_photo_uploaded_at: new Date().toISOString()
          };

      const updateResult = await client
        .from("quotes")
        .update(updateData)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (updateResult.error) {
        setModalBusy(false);
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(
          jobId,
          updateResult.error.message,
          "error"
        );

        return;
      }

      showJobMessage(jobId, "Photo uploaded successfully.", "info");
      showToast("Photo uploaded", "success");
      await loadJobs();
      setModalBusy(false);

      if (pendingPhotoButton) {
        pendingPhotoButton.disabled = false;
        pendingPhotoButton = null;
      }
    }

    window.uploadPhoto = uploadPhoto;

    async function updateJob(jobId, changes, loadingText, options = {}) {
      const closeOnSuccess = Boolean(options.closeOnSuccess);
      const buttonElement = options.buttonElement || null;
      const successToast = String(options.successToast || "Status updated");
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return false;
      }

      setModalBusy(true);

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      if (loadingText) {
        showJobMessage(jobId, loadingText, "info");
      }

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);

        if (buttonElement) {
          buttonElement.disabled = false;
        }

        showJobMessage(jobId, result.error.message, "error");
        return false;
      }

      await loadJobs();

      if (closeOnSuccess) {
        closeJobDetails(true);
      }

      showToast(successToast, "success");

      setModalBusy(false);

      if (buttonElement) {
        buttonElement.disabled = false;
      }

      return true;
    }

    async function acceptJob(jobId, buttonElement) {
      await updateJob(
        jobId,
        { driver_acceptance_status: "accepted" },
        "Accepting job…",
        {
          buttonElement,
          successToast: "Job accepted"
        }
      );
    }

    window.acceptJob = acceptJob;

    async function rejectJob(jobId, buttonElement) {
      await updateJob(
        jobId,
        { driver_acceptance_status: "rejected" },
        "Rejecting job…",
        {
          closeOnSuccess: true,
          buttonElement,
          successToast: "Job rejected"
        }
      );
    }

    window.rejectJob = rejectJob;

    function workflowUpdate(status) {
      return selectedJob => {
        const changes = { status };

        if (usesDriverWorkflowStatus(selectedJob)) {
          changes.driver_workflow_status = status;
        }

        return changes;
      };
    }

    async function markEnRouteToPickup(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      await updateJob(
        jobId,
        workflowUpdate("en_route_to_pickup")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );
    }

    window.markEnRouteToPickup = markEnRouteToPickup;

    async function markArrivedAtPickup(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      await updateJob(
        jobId,
        workflowUpdate("arrived_at_pickup")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );
    }

    window.markArrivedAtPickup = markArrivedAtPickup;

    async function markPickedUp(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      await updateJob(
        jobId,
        workflowUpdate("picked_up")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );
    }

    window.markPickedUp = markPickedUp;

    async function markEnRouteToDelivery(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      await updateJob(
        jobId,
        workflowUpdate("en_route_to_delivery")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );
    }

    window.markEnRouteToDelivery = markEnRouteToDelivery;

    async function markArrivedAtDelivery(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      await updateJob(
        jobId,
        workflowUpdate("arrived_at_delivery")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );
    }

    window.markArrivedAtDelivery = markArrivedAtDelivery;

    async function markDelivered(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      const recipientInput = document.getElementById("podRecipientModal-" + jobId);
      const recipientName = String(recipientInput?.value || "").trim();
      const hasPhoto = Boolean(selectedJob?.delivery_photo_url);

      if (!hasPhoto && !recipientName) {
        showJobMessage(
          jobId,
          "Provide either a delivery photo or POD recipient name.",
          "error"
        );

        return;
      }

      setModalBusy(true);

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      showJobMessage(jobId, "Completing delivery…", "info");

      const podField = podRecipientField(selectedJob);
      const changes = {
        status: "delivered",
        completed_at: new Date().toISOString()
      };

      if (usesDriverWorkflowStatus(selectedJob)) {
        changes.driver_workflow_status = "delivered";
      }

      if (recipientName) {
        changes[podField] = recipientName;
      }

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);

        if (buttonElement) {
          buttonElement.disabled = false;
        }

        showJobMessage(jobId, result.error.message, "error");
        return;
      }

      await loadJobs();
      closeJobDetails(true);
      showToast("Delivery completed", "success");
      setModalBusy(false);

      if (buttonElement) {
        buttonElement.disabled = false;
      }
    }

    window.markDelivered = markDelivered;

    jobModalClose.addEventListener("click", () => closeJobDetails(false));
    jobModalBackdrop.addEventListener("click", () => closeJobDetails(false));
    routeModalClose.addEventListener("click", closeSuggestedRouteModal);
    routeModalBackdrop.addEventListener("click", closeSuggestedRouteModal);
    viewRouteButton.addEventListener("click", openSuggestedRouteModal);

    document
      .getElementById("refreshButton")
      .addEventListener("click", loadJobs);

    document
      .getElementById("signOutButton")
      .addEventListener("click", async function () {
        this.disabled = true;
        this.textContent = "Signing Out…";

        try {
          await client.auth.signOut();
        } finally {
          localStorage.clear();
          sessionStorage.clear();
          location.replace("/index.html");
        }
      });

    (async function start() {
      const validDriver = await verifyDriver();

      if (validDriver) {
        await loadJobs();
      }
    })();
  </script>
<script src="/menu.js"></script></body>
</html>
