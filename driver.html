<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Driver</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --dark: #064f3b;
      --green: #087455;
      --blue: #2f7be7;
      --orange: #e7862f;
      --yellow: #c6a000;
      --purple: #7f47de;
      --dark-purple: #4a2b8a;
      --gray: #7b8791;
      --light-green: #e7f5ef;
      --coral: #ff665c;
      --background: #f6faf8;
      --white: #ffffff;
      --ink: #17221e;
      --muted: #68756f;
      --line: #dfe8e4;
      --danger: #a32d2d;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--dark);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.08;
    }

    .brand span {
      color: var(--coral);
    }

    .brand-subtitle {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .driver-email {
      margin-top: 6px;
      font-size: 12px;
      opacity: .82;
      overflow-wrap: anywhere;
    }

    .signout {
      border: 0;
      border-radius: 14px;
      padding: 14px 17px;
      background: white;
      color: var(--dark);
      font-weight: 900;
      min-width: 108px;
    }

    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 22px 18px 50px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 42px;
      line-height: 1.05;
    }

    h2 {
      margin: 0;
      font-size: 28px;
    }

    .earnings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .earning-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      min-height: 124px;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
      display: grid;
      align-content: space-between;
    }

    .earning-amount {
      color: var(--green);
      font-size: 31px;
      font-weight: 900;
      line-height: 1.05;
    }

    .earning-label {
      color: var(--muted);
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .refresh {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      background: white;
      color: var(--dark);
      font-weight: 800;
    }

    .route-button {
      border: 1px solid #cfe1da;
      border-radius: 12px;
      padding: 11px 14px;
      background: #edf7f3;
      color: var(--dark);
      font-weight: 800;
    }

    .next-stop-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, .05);
      margin-bottom: 10px;
    }

    .next-stop-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .next-stop-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .next-stop-main {
      min-width: 0;
    }

    .next-stop-type {
      font-size: 11px;
      font-weight: 900;
      color: var(--green);
      text-transform: uppercase;
    }

    .next-stop-job {
      font-size: 18px;
      font-weight: 900;
      color: var(--dark);
      margin-top: 2px;
    }

    .next-stop-city {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-stop-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .next-stop-expand,
    .next-stop-nav,
    .next-stop-open {
      border: 1px solid var(--line);
      background: white;
      color: var(--dark);
      min-height: 38px;
      padding: 8px 11px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .next-stop-nav {
      background: #edf7f3;
      border-color: #cfe1da;
    }

    .next-stop-details {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 9px;
      display: grid;
      gap: 8px;
    }

    .next-stop-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .route-modal-sheet {
      position: relative;
      background: white;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
      animation: modalUp .22s ease-out;
    }

    .route-helper {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .route-list {
      display: grid;
      gap: 8px;
    }

    .route-stop {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fbfdfc;
      cursor: pointer;
    }

    .route-stop-index {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #edf7f3;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .route-stop-type {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .route-stop-job {
      color: var(--dark);
      font-size: 15px;
      font-weight: 900;
      margin-top: 1px;
    }

    .route-stop-place,
    .route-stop-distance {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .toast-wrap {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 120;
      display: grid;
      gap: 8px;
      width: min(92vw, 420px);
      pointer-events: none;
    }

    .toast {
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.35;
      color: white;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(6px);
      animation: toastIn .18s ease-out forwards;
    }

    .toast.success { background: #0c7f5c; }
    .toast.error { background: #9e2f2f; }
    .toast.info { background: #355a8a; }

    @keyframes toastIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .job-list {
      display: grid;
      gap: 10px;
    }

    .compact-job {
      background: white;
      border: 1px solid var(--line);
      border-left: 6px solid #d7e2de;
      border-radius: 14px;
      padding: 11px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      min-height: 102px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 7px;
      cursor: pointer;
    }

    .compact-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .compact-job-number {
      color: var(--dark);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .compact-badges {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .compact-job.category-medical { border-left-color: #d34545; }
    .compact-job.category-pallet { border-left-color: #8a5a2f; }
    .compact-job.category-legal { border-left-color: #c6a000; }
    .compact-job.category-general { border-left-color: #d7e2de; }
    .compact-job.category-special { border-left-color: #e7862f; }

    .category-badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .02em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      background: #f8fcfa;
      color: var(--dark);
      white-space: nowrap;
    }

    .return-badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .03em;
      text-transform: uppercase;
      background: #fff1df;
      color: #a85d00;
      border: 1px solid #ffd3a6;
      white-space: nowrap;
    }

    .status {
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--light-green);
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .status-new,
    .status-assigned,
    .status-accepted {
      background: #e8f8ee;
      color: var(--green);
    }

    .status-en-route-pickup {
      background: #e9f1ff;
      color: var(--blue);
    }

    .status-at-pickup {
      background: #fff2e5;
      color: var(--orange);
    }

    .status-picked-up {
      background: #fff8dc;
      color: var(--yellow);
    }

    .status-en-route-delivery {
      background: #f1eaff;
      color: var(--purple);
    }

    .status-at-delivery {
      background: #ece5ff;
      color: var(--dark-purple);
    }

    .status-delivered {
      background: #f0f3f5;
      color: var(--gray);
    }

    .new-badge {
      border-radius: 999px;
      padding: 6px 10px;
      background: #ff665c;
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .compact-route {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compact-stop {
      font-size: 13px;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-customer {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .compact-arrow {
      color: var(--green);
      font-size: 13px;
      font-weight: 900;
    }

    .compact-chevron {
      color: #8ea09a;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
    }

    .compact-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .compact-speed {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .compact-pay {
      color: var(--green);
      font-weight: 900;
      font-size: 18px;
      margin-top: 2px;
    }

    .deadline-block {
      display: grid;
      gap: 4px;
      justify-items: end;
      text-align: right;
    }

    .deadline-due {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .deadline-badge {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid #cfe1da;
      background: #edf7f3;
      color: var(--green);
      white-space: nowrap;
    }

    .countdown-inline {
      display: inline-block;
    }

    .deadline-normal {
      border-color: #cfe1da;
      background: #edf7f3;
      color: var(--green);
    }

    .deadline-caution {
      border-color: #f1df9a;
      background: #fff8df;
      color: #8a6b00;
    }

    .deadline-urgent {
      border-color: #ffc7a0;
      background: #fff1e6;
      color: #b54f00;
    }

    .deadline-overdue {
      border-color: #f2b4b4;
      background: #fff0f0;
      color: #9d2e2e;
    }

    .job-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      align-items: end;
    }

    .job-modal[hidden] {
      display: none;
    }

    .job-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .45);
    }

    .job-modal-sheet {
      position: relative;
      background: white;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
      animation: modalUp .22s ease-out;
    }

    @keyframes modalUp {
      from {
        transform: translateY(18px);
        opacity: .55;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .job-modal-close {
      border: 1px solid var(--line);
      background: white;
      color: var(--dark);
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-weight: 900;
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .modal-title {
      margin: 2px 52px 6px 0;
      color: var(--dark);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
    }

    .modal-status-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .modal-pay {
      margin: 0;
      color: var(--green);
      font-size: 24px;
      font-weight: 900;
    }

    .modal-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .modal-item {
      background: #f8fcfa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }

    .modal-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-value {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .modal-section-title {
      color: var(--dark);
      font-size: 16px;
      font-weight: 900;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .modal-divider-arrow {
      color: var(--green);
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      margin: 6px 0;
    }

    .detail-summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .detail-summary-item {
      background: #f8fcfa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      min-height: 74px;
    }

    .detail-summary-value {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .route-stack {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .stop-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fbfdfc;
    }

    .stop-heading {
      color: var(--green);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 7px;
    }

    .stop-line {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
    }

    .stop-name {
      font-weight: 900;
    }

    .stop-line + .stop-line {
      margin-top: 2px;
    }

    .stop-meta {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .stop-note {
      border-top: 1px solid var(--line);
      padding-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stop-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stop-actions .action {
      min-height: 42px;
      padding: 10px 13px;
    }

    .compact-actions {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .workflow-panel {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #f6faf8;
      border: 1px solid var(--line);
    }

    .workflow-panel .modal-note {
      margin-top: 8px;
    }

    .pod-field {
      margin-top: 10px;
    }

    .photo-actions {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-added {
      background: #e8f8ee;
      color: #0c7f5c;
      border: 1px solid #bfe6d2;
      border-radius: 12px;
      min-height: 42px;
      padding: 10px 12px;
      font-weight: 900;
      text-align: center;
    }

    .workflow-panel .workflow-grid,
    .workflow-panel .button-grid {
      margin-top: 0;
    }

    .detail-photo-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .photo-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfdfc;
      padding: 12px;
    }

    .photo-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .photo-title {
      color: var(--dark);
      font-size: 14px;
      font-weight: 900;
    }

    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .modal-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .return-details {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfdfc;
      overflow: hidden;
    }

    .return-details summary {
      list-style: none;
      cursor: pointer;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 900;
      color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .return-details summary::-webkit-details-marker {
      display: none;
    }

    .return-content {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }

    .return-item {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .return-item strong {
      color: var(--dark);
    }

    .action {
      border: 0;
      border-radius: 13px;
      min-height: 48px;
      padding: 11px 14px;
      font-weight: 900;
    }

    .directions {
      background: #edf3f0;
      color: var(--dark);
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .photo-button {
      background: #eef7ff;
      color: #135a82;
    }

    .action:disabled {
      opacity: .48;
      cursor: default;
    }

    .photo-area {
      margin-top: 8px;
      border: 1px dashed #b9c9c2;
      border-radius: 12px;
      padding: 10px;
      background: #fafdfb;
    }

    .photo-area img {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
    }

    .photo-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .delivery-options {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 1px solid #ccd8d3;
      border-radius: 12px;
      background: white;
      color: var(--ink);
    }

    textarea {
      min-height: 80px;

  <script>
    const client = supabase.createClient(
  "https://dczlucwfjayymlwbzzdi.supabase.co",
  "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
);

window.mgSupabaseClient = client;

    const activeJobsBox = document.getElementById("activeJobs");
    const nextSuggestedStopBox = document.getElementById("nextSuggestedStop");
    const jobModal = document.getElementById("jobModal");
    const jobModalContent = document.getElementById("jobModalContent");
    const jobModalBackdrop = document.getElementById("jobModalBackdrop");
    const jobModalClose = document.getElementById("jobModalClose");
    const routeModal = document.getElementById("routeModal");
    const routeModalBackdrop = document.getElementById("routeModalBackdrop");
    const routeModalClose = document.getElementById("routeModalClose");
    const routeModalList = document.getElementById("routeModalList");
    const viewRouteButton = document.getElementById("viewRouteButton");
    const toastWrap = document.getElementById("toastWrap");

    let currentSession = null;
    let driver = null;
    let jobs = [];
    let selectedJobId = null;
    let selectedJob = null;
    let modalBusy = false;
    let pendingPhotoButton = null;
    let nextStopExpanded = false;
    const localWorkflowStage = Object.create(null);
    let countdownTimerId = null;

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    function money(value) {
      return Number(value || 0).toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
    }

    function statusLabel(status) {
      const labels = {
        assigned: "Assigned",
        accepted: "Accepted",
        en_route_pickup: "En Route to Pickup",
        arrived_pickup: "At Pickup",
        en_route_delivery: "En Route to Delivery",
        arrived_delivery: "At Delivery",
        arrived_at_pickup: "Arrived at Pickup",
        en_route_to_pickup: "En Route to Pickup",
        picked_up: "Picked Up",
        arrived_at_delivery: "Arrived at Delivery",
        en_route_to_delivery: "En Route to Delivery",
        new: "Assigned",
        waiting_payment: "Waiting",
        paid: "Ready",
        ready: "Ready",
        in_transit: "In Transit",
        delivered: "Delivered",
        cancelled: "Cancelled"
      };

      return labels[status] ||
        String(status || "").replaceAll("_", " ");
    }

    function normalizeJobStatus(job) {
      const workflowStatus = String(job?.driver_workflow_status || "").toLowerCase();
      const rawStatus = String(job?.status || "assigned").toLowerCase();
      const source = workflowStatus || rawStatus;

      if (source === "new") return "assigned";
      if (source === "in_transit") return "en_route_to_delivery";
      if (source === "en_route_pickup") return "en_route_to_pickup";
      if (source === "arrived_pickup") return "arrived_at_pickup";
      if (source === "en_route_delivery") return "en_route_to_delivery";
      if (source === "arrived_delivery") return "arrived_at_delivery";

      return source;
    }

    function hasAccepted(job) {
      return String(job.driver_acceptance_status || "").toLowerCase() === "accepted";
    }

    function formatDate(value) {
      if (!value) return "";

      return new Date(value).toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function beginningOfToday() {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function beginningOfWeek() {
      const date = beginningOfToday();
      const day = date.getDay();
      const difference = day === 0 ? 6 : day - 1;
      date.setDate(date.getDate() - difference);
      return date;
    }

    function beginningOfMonth() {
      const date = beginningOfToday();
      date.setDate(1);
      return date;
    }

    function completedDate(job) {
      return new Date(job.completed_at || job.created_at);
    }

    function firstName(value) {
      const fullName = String(value || "").trim();
      if (!fullName) return "";
      return fullName.split(/\s+/)[0] || "";
    }

    function greetingText(now) {
      const hour = now.getHours();
      if (hour >= 5 && hour < 12) return "Good Morning";
      if (hour >= 12 && hour < 17) return "Good Afternoon";
      return "Good Evening";
    }

    function updateEarnings() {
      const delivered = jobs.filter(job => job.status === "delivered");

      const totalSince = start =>
        delivered
          .filter(job => completedDate(job) >= start)
          .reduce((sum, job) => sum + Number(job.driver_pay || 0), 0);

      document.getElementById("todayEarnings").textContent =
        money(totalSince(beginningOfToday()));

      document.getElementById("weekEarnings").textContent =
        money(totalSince(beginningOfWeek()));

      document.getElementById("activeCount").textContent =
        jobs.filter(job =>
          !["delivered", "cancelled"].includes(job.status)
        ).length;
    }

    function mapLink(address) {
      return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address || "");
    }

    function mapDirectionsLink(address) {
      return "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(address || "");
    }

    function fieldValue(job, keys) {
      for (const key of keys) {
        const value = job?.[key];

        if (value !== null && value !== undefined && String(value).trim() !== "") {
          return String(value).trim();
        }
      }

      return "";
    }

    function shortAddress(address) {
      const value = String(address || "").trim();
      if (!value) return "Address not available";

      const compact = value
        .split(",")
        .map(part => part.trim())
        .filter(Boolean)
        .slice(0, 2)
        .join(", ");

      if (compact.length <= 34) return compact;
      return compact.slice(0, 31) + "...";
    }

    function locationSummary(job, prefix) {
      const city = fieldValue(job, [
        prefix + "_city",
        prefix + "City"
      ]);

      if (city) return city;

      return shortAddress(job[prefix + "_address"]);
    }

    function scheduledTimestamp(job) {
      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at",
        "created_at"
      ]);

      const value = source ? Date.parse(source) : 0;
      return Number.isFinite(value) ? value : 0;
    }

    function deliverySpeedOrTime(job) {
      if (job.delivery_speed) {
        return String(job.delivery_speed);
      }

      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at"
      ]);

      if (source) {
        return "Scheduled " + formatDate(source);
      }

      return "Standard";
    }

    function deliverySpeedHours(job) {
      const value = String(job?.delivery_speed || "").trim().toLowerCase();
      const map = {
        "2_hr": 2,
        "3_hr": 3,
        "4_hr": 4,
        "5_hr": 5,
        "6_hr": 6
      };

      return map[value] || 0;
    }

    function parseTimestamp(value) {
      if (!value) return 0;
      const parsed = Date.parse(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function countdownStartTimestamp(job) {
      const preferred = [
        "assigned_at",
        "dispatched_at",
        "sent_to_driver_at",
        "driver_assigned_at",
        "approved_at"
      ];

      for (const key of preferred) {
        const parsed = parseTimestamp(job?.[key]);
        if (parsed > 0) return parsed;
      }

      return parseTimestamp(job?.created_at);
    }

    function countdownInfo(job, nowMs = Date.now()) {
      const status = normalizeJobStatus(job);

      if (["delivered", "cancelled"].includes(status)) {
        return null;
      }

      const hours = deliverySpeedHours(job);
      if (!hours) {
        return null;
      }

      const startMs = countdownStartTimestamp(job);
      if (!startMs) {
        return null;
      }

      const deadlineMs = startMs + (hours * 60 * 60 * 1000);
      const deltaMs = deadlineMs - nowMs;
      const absoluteMinutes = Math.max(0, Math.floor(Math.abs(deltaMs) / 60000));
      const remainingMinutes = Math.max(0, Math.floor(deltaMs / 60000));

      let severity = "normal";

      if (deltaMs < 0) {
        severity = "overdue";
      } else if (remainingMinutes <= 30) {
        severity = "urgent";
      } else if (remainingMinutes <= 60) {
        severity = "caution";
      }

      const hoursLeft = Math.floor(remainingMinutes / 60);
      const minutesLeft = remainingMinutes % 60;
      const leftLabel =
        deltaMs < 0
          ? `OVERDUE • ${absoluteMinutes} min`
          : `${hoursLeft ? `${hoursLeft} hr ` : ""}${minutesLeft} min left`.trim();

      return {
        dueLabel: new Date(deadlineMs).toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        }),
        leftLabel,
        severity
      };
    }

    function hasDisplayValue(value) {
      if (value === null || value === undefined) return false;

      const text = String(value).trim();
      if (!text) return false;

      return text.toLowerCase() !== "not provided";
    }

    function humanizeDbValue(value) {
      const text = String(value || "").trim();
      if (!text) return "";

      const directMap = {
        business_to_business: "Business to Business",
        on_demand: "On Demand",
        same_day: "Same Day",
        next_day: "Next Day",
        two_hour: "2 Hour",
        two_hr: "2 Hour",
        '2_hr': "2 Hour",
        four_hr: "4 Hour",
        '4_hr': "4 Hour",
        medical_specimen: "Medical Specimen"
      };

      const normalized = text.toLowerCase();
      if (directMap[normalized]) {
        return directMap[normalized];
      }

      return text
        .replace(/[_-]+/g, " ")
        .replace(/\b(\d+)\s*hr\b/gi, "$1 Hour")
        .replace(/\b\w+/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
    }

    function cityStateZip(job, prefix) {
      const city = fieldValue(job, [prefix + "_city", prefix + "City"]);
      const state = fieldValue(job, [prefix + "_state", prefix + "State"]);
      const zip = fieldValue(job, [prefix + "_zip", prefix + "_postal_code", prefix + "_postcode"]);

      const cityState = [city, state].filter(hasDisplayValue).join(", ");
      return [cityState, zip].filter(hasDisplayValue).join(" ");
    }

    function stopAddressLines(job, prefix) {
      const address = fieldValue(job, [prefix + "_address"]);
      const suite = fieldValue(job, [prefix + "_suite", prefix + "_floor", prefix + "_unit", prefix + "_suite_floor"]);
      const place = cityStateZip(job, prefix);

      return [address, suite, place].filter(hasDisplayValue);
    }

    function stopDisplayName(job, prefix) {
      const businessName = fieldValue(job, [
        prefix + "_company",
        prefix + "_business"
      ]);

      if (hasDisplayValue(businessName)) {
        return businessName;
      }

      const contactName = fieldValue(job, [
        prefix + "_contact_name",
        prefix + "_contact",
        prefix + "_name"
      ]);

      return hasDisplayValue(contactName) ? contactName : "";
    }

    function summaryValue(job, keys, fallback = "") {
      const value = fieldValue(job, keys);
      return hasDisplayValue(value) ? humanizeDbValue(value) : fallback;
    }

    function renderSummaryItem(label, value, emphasize = false) {
      if (!hasDisplayValue(value)) return "";

      return `
        <div class="detail-summary-item">
          <div class="modal-label">${escapeHtml(label)}</div>
          <div class="detail-summary-value${emphasize ? " modal-pay" : ""}">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function renderStopCard(job, prefix, title) {
      const name = stopDisplayName(job, prefix);
      const lines = stopAddressLines(job, prefix);
      const notes = fieldValue(job, [prefix + "_notes", prefix + "_instructions"]);

      return `
        <div class="stop-card">
          <div class="stop-heading">${escapeHtml(title)}</div>
          <div class="stop-meta">
            ${hasDisplayValue(name) ? `<div class="stop-line stop-name">${escapeHtml(name)}</div>` : ""}
            ${lines.map(line => `<div class="stop-line">${escapeHtml(line)}</div>`).join("")}
          </div>
          ${hasDisplayValue(notes) ? `<div class="stop-note">${escapeHtml(notes)}</div>` : ""}
          <div class="stop-actions">
            <button class="action directions" type="button" onclick="navigateForStop('${job.id}','${prefix.toUpperCase()}')">Navigate</button>
          </div>
        </div>
      `;
    }

    function photoInput(jobId, type) {
      return `
        <input
          id="${type}File-${jobId}"
          type="file"
          accept="image/*"
          capture="environment"
          hidden
          onchange="uploadPhoto('${jobId}','${type}',this)"
        >
      `;
    }

    function openPhotoPicker(jobId, type, buttonElement) {
      const input = document.getElementById(type + "File-" + jobId);
      if (!input) return;

      pendingPhotoButton = buttonElement || null;

      if (pendingPhotoButton) {
        pendingPhotoButton.disabled = true;
      }

      input.click();
    }

    window.openPhotoPicker = openPhotoPicker;

    function photoStageForState(state) {
      if (["picked_up", "driving_to_delivery", "arrived_delivery"].includes(state)) {
        return "delivery";
      }

      if (state === "delivered") {
        return "";
      }

      return "pickup";
    }

    function photoStageForJob(job) {
      return photoStageForState(workflowState(job));
    }

    function workflowPhotoButtonLabel(job) {
      const stage = photoStageForJob(job);

      if (stage === "pickup") {
        return job.pickup_photo_url ? "✓ Photo Added" : "📷 Add Photo";
      }

      if (stage === "delivery") {
        return job.delivery_photo_url ? "✓ Photo Added" : "📷 Add Photo";
      }

      return "📷 Add Photo";
    }

    function workflowPhotoStatusText(job) {
      const stage = photoStageForJob(job);

      if (stage === "pickup" && job.pickup_photo_url) {
        return "Pickup photo saved."
      }

      if (stage === "delivery" && job.delivery_photo_url) {
        return "Delivery photo saved.";
      }

      return "Photos are optional.";
    }

    function workflowStagePhotoUrl(job) {
      const stage = photoStageForJob(job);

      if (stage === "pickup") {
        return String(job?.pickup_photo_url || "").trim();
      }

      if (stage === "delivery") {
        return String(job?.delivery_photo_url || "").trim();
      }

      return "";
    }

    function photoStageActionButtons(job) {
      const stage = photoStageForJob(job);
      if (!stage) return "";

      const url = workflowStagePhotoUrl(job);

      if (!url) {
        return `
          <button class="action photo-button" type="button" onclick="openStagePhotoPicker('${job.id}',this)">
            📷 Add Photo
          </button>
        `;
      }

      return `
        <div class="photo-added">✓ Photo Added</div>
        <div class="photo-actions">
          <button class="action directions" type="button" onclick="viewStagePhoto('${job.id}')">View Photo</button>
          <button class="action photo-button" type="button" onclick="openStagePhotoPicker('${job.id}',this)">Retake Photo</button>
        </div>
      `;
    }

    function viewStagePhoto(jobId) {
      const selectedJob = getSelectedJob(jobId);
      if (!selectedJob?.id) return;

      const url = workflowStagePhotoUrl(selectedJob);
      if (!url) return;

      window.open(url, "_blank");
    }

    window.viewStagePhoto = viewStagePhoto;

    function updateOpenJobCountdown() {
      if (jobModal.hidden || !selectedJobId) {
        return;
      }

      const job = getSelectedJob(selectedJobId);
      if (!job?.id) {
        return;
      }

      const wrap = document.getElementById("jobCountdownWrap-" + job.id);
      const due = document.getElementById("jobDue-" + job.id);
      const left = document.getElementById("jobLeft-" + job.id);

      if (!wrap || !due || !left) {
        return;
      }

      const countdown = countdownInfo(job);

      if (!countdown) {
        wrap.hidden = true;
        return;
      }

      wrap.hidden = false;
      due.textContent = countdown.dueLabel;
      left.textContent = countdown.leftLabel;
      left.className = "detail-summary-value countdown-inline deadline-badge deadline-" + countdown.severity;
    }

    function openStagePhotoPicker(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      if (!selectedJob?.id) return;

      const stage = photoStageForJob(selectedJob);
      if (!stage) return;

      openPhotoPicker(jobId, stage, buttonElement);
    }

    window.openStagePhotoPicker = openStagePhotoPicker;

    function getSelectedJob(jobId) {
      const effectiveId = jobId || selectedJobId;
      if (!effectiveId) return null;

      const match = jobs.find(item => item.id === effectiveId);
      if (!match?.id) return null;

      selectedJob = match;
      selectedJobId = match.id;

      return match;
    }

    function showToast(text, type = "info") {
      if (!toastWrap || !text) return;

      const toast = document.createElement("div");
      toast.className = "toast " + type;
      toast.textContent = text;
      toastWrap.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(6px)";

        setTimeout(() => {
          toast.remove();
        }, 180);
      }, 2200);
    }

    function routeStopType(job) {
      const status = normalizeJobStatus(job);
      const deliveryStates = [
        "picked_up",
        "en_route_to_delivery",
        "arrived_at_delivery",
        "delivered"
      ];

      return deliveryStates.includes(status) ? "DELIVERY" : "PICKUP";
    }

    function routeDestinationAddress(job) {
      const stopType = routeStopType(job);
      const prefix = stopType === "DELIVERY" ? "delivery" : "pickup";

      const address = fieldValue(job, [
        prefix + "_address"
      ]);

      const city = fieldValue(job, [
        prefix + "_city",
        prefix + "City"
      ]);

      const state = fieldValue(job, [
        prefix + "_state",
        prefix + "State"
      ]);

      const zip = fieldValue(job, [
        prefix + "_zip",
        prefix + "_postal_code",
        prefix + "_postcode"
      ]);

      return [address, city, state, zip]
        .filter(Boolean)
        .join(", ");
    }

    function routePriority(job) {
      const status = normalizeJobStatus(job);

      if (["en_route_to_pickup", "arrived_at_pickup"].includes(status)) {
        return 1;
      }

      if (
        (status === "assigned" && acceptancePending(job)) ||
        status === "accepted" ||
        (status === "assigned" && hasAccepted(job))
      ) {
        return 2;
      }

      if (["picked_up", "en_route_to_delivery", "arrived_at_delivery"].includes(status)) {
        return 3;
      }

      return 4;
    }

    function buildSuggestedRouteStops() {
      const sourceJobs = Array.isArray(jobs)
        ? jobs.filter(Boolean)
        : [];

      return sourceJobs
        .filter(job => {
          const status = normalizeJobStatus(job);
          const acceptance = String(job.driver_acceptance_status || "").toLowerCase();

          return !["delivered", "cancelled"].includes(status) && acceptance !== "rejected";
        })
        .sort((left, right) => {
          const p = routePriority(left) - routePriority(right);
          if (p !== 0) return p;

          const pickupDiff = scheduledTimestamp(left) - scheduledTimestamp(right);
          if (pickupDiff !== 0) return pickupDiff;

          const createdDiff = (Date.parse(left.created_at || 0) || 0) - (Date.parse(right.created_at || 0) || 0);
          if (createdDiff !== 0) return createdDiff;

          return String(left.job_number || "").localeCompare(String(right.job_number || ""));
        })
        .map((job, index, arr) => {
          const stopType = routeStopType(job);
          const destination = routeDestinationAddress(job);
          const city = locationSummary(job, stopType === "DELIVERY" ? "delivery" : "pickup");

          const currentZipRaw = fieldValue(job, [
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_zip",
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_postal_code",
            (stopType === "DELIVERY" ? "delivery" : "pickup") + "_postcode"
          ]);

          const prev = arr[index - 1];
          const prevType = prev ? routeStopType(prev) : null;
          const prevZipRaw = prev
            ? fieldValue(prev, [
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_zip",
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_postal_code",
                (prevType === "DELIVERY" ? "delivery" : "pickup") + "_postcode"
              ])
            : "";

          const currentZip = Number(String(currentZipRaw).replace(/\D/g, ""));
          const previousZip = Number(String(prevZipRaw).replace(/\D/g, ""));
          const hasEstimate = Number.isFinite(currentZip) && Number.isFinite(previousZip) && currentZip > 0 && previousZip > 0;
          const distance = hasEstimate
            ? (Math.max(1, Math.abs(currentZip - previousZip) / 18) + 0.8).toFixed(1) + " miles away"
            : "Distance estimate unavailable";

          return {
            index: index + 1,
            jobId: job.id,
            jobNumber: job.job_number,
            stopType,
            city,
            destination,
            distance,
            job
          };
        });
    }

    function usesDriverWorkflowStatus(job = null) {
      if (job && Object.prototype.hasOwnProperty.call(job, "driver_workflow_status")) {
        return true;
      }

      return jobs.some(item =>

    function podRecipientField(job) {
      if (Object.prototype.hasOwnProperty.call(job, "pod_recipient_name")) {
        return "pod_recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "recipient_name")) {
        return "recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "delivery_recipient_name")) {
        return "delivery_recipient_name";
      }

      return "pod_recipient_name";
    }

    function podRecipientValue(job) {
      return String(
        job.pod_recipient_name ||
        job.recipient_name ||
        job.delivery_recipient_name ||

      ).trim();

    function acceptancePending(job) {
      const value = String(job.driver_acceptance_status || "").toLowerCase();
      return !value || value === "pending";
    }

    function setLocalWorkflowStage(jobId, stage) {
      if (!jobId) return;

      if (!stage) {
        delete localWorkflowStage[jobId];
        return;
      }

      localWorkflowStage[jobId] = stage;
    }

    function localWorkflowOverride(job) {
      const jobId = job?.id;
      if (!jobId) return "";

      const override = localWorkflowStage[jobId];
      if (!override) return "";

      const status = normalizeJobStatus(job);

      if (override === "arrived_pickup" && status === "en_route_to_pickup") {
        return "arrived_pickup";
      }

      if (override === "arrived_delivery" && status === "en_route_to_delivery") {
        return "arrived_delivery";
      }

      delete localWorkflowStage[jobId];
      return "";
    }

    function workflowState(job) {
      const status = normalizeJobStatus(job);
      const override = localWorkflowOverride(job);

      if (status === "assigned" && acceptancePending(job)) {
        return "pending";
      }

      if (status === "assigned" && hasAccepted(job)) {
        return "accepted";
      }

      if (override) {
        return override;
      }

      if (status === "en_route_to_pickup") return "driving_to_pickup";
      if (status === "arrived_at_pickup") return "arrived_pickup";
      if (status === "picked_up") return "picked_up";
      if (status === "en_route_to_delivery") return "driving_to_delivery";
      if (status === "arrived_at_delivery") return "arrived_delivery";
      if (status === "delivered") return "delivered";

      return "other";
    }

    function statusBadgeClass(job) {
      const status = normalizeJobStatus(job);

      if (status === "assigned" && acceptancePending(job)) return "status-new";
      if (status === "assigned" && hasAccepted(job)) return "status-accepted";
      if (status === "en_route_to_pickup") return "status-en-route-pickup";
      if (status === "arrived_at_pickup") return "status-at-pickup";
      if (status === "picked_up") return "status-picked-up";
      if (status === "en_route_to_delivery") return "status-en-route-delivery";
      if (status === "arrived_at_delivery") return "status-at-delivery";
      if (status === "delivered") return "status-delivered";

      return "status-assigned";
    }

    function cardWorkflowLabel(job) {
      const status = normalizeJobStatus(job);

      if (status === "assigned" && acceptancePending(job)) {
        return "NEW";
      }

      if (status === "assigned" && hasAccepted(job)) {
        return "ACCEPTED";
      }

      if (status === "en_route_to_pickup") return "EN ROUTE TO PICKUP";
      if (status === "arrived_at_pickup") return "AT PICKUP";
      if (status === "picked_up") return "PICKED UP";
      if (status === "en_route_to_delivery") return "EN ROUTE TO DELIVERY";
      if (status === "arrived_at_delivery") return "AT DELIVERY";
      if (status === "delivered") return "DELIVERED";

      return String(statusLabel(status)).toUpperCase();
    }

    function normalizeJobCategory(job) {
      const raw = String(job?.job_category || "").trim().toLowerCase();

      if (!raw) return "general";

      if (raw.includes("medical")) return "medical";
      if (raw.includes("pallet")) return "pallet";
      if (raw.includes("legal")) return "legal";
      if (raw.includes("special")) return "special";

      return "general";
    }

    function jobCategoryLabel(job) {
      const category = normalizeJobCategory(job);

      if (category === "medical") return "Medical";
      if (category === "pallet") return "Pallet";
      if (category === "legal") return "Legal";
      if (category === "special") return "Special";

      return "General";
    }

    function categoryCardClass(job) {
      return "category-" + normalizeJobCategory(job);
    }

    function isReturnRequired(job) {
      const value = String(job?.return_required ?? "").toLowerCase();
      return value === "true" || value === "1" || value === "yes";

      const type = String(job?.return_location_type || "").toLowerCase();

      if (type === "same_as_pickup") {

          fieldValue(job, ["pickup_city", "pickupCity"]),

        .filter(job => {

          return !["delivered", "cancelled"].includes(status) && acceptance !== "rejected";
        })
        .sort((left, right) => {
          const leftCreated = Date.parse(left.created_at || 0) || 0;
          const rightCreated = Date.parse(right.created_at || 0) || 0;
          return rightCreated - leftCreated;
        });

      } catch (error) {
        console.error("Failed to render active jobs", error);
        activeJobsBox.innerHTML = '<div class="message error">Unable to render assigned jobs.</div>';
      }

      renderNextSuggestedStopCard();
    }

    function showJobMessage(jobId, text, type) {
      const box = document.getElementById("message-" + jobId);

      if (!box) {
        if (text && type === "error") {
          showToast(text, "error");
        }

        return;
      }

      box.className = "message " + type;
      box.textContent = text;

      if (text && type === "error") {
        showToast(text, "error");
      }
    }

    async function verifyDriver() {
      const sessionResult = await client.auth.getSession();
      currentSession = sessionResult.data.session;

      if (!currentSession) {
        location.replace("/index.html");
        return false;
      }

      const profileResult = await client
        .from("profiles")
        .select("role,full_name")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      const role = String(
        profileResult.data?.role || ""
      ).toLowerCase();

      if (role !== "driver") {
        await client.auth.signOut();
        location.replace("/index.html");
        return false;
      }

      const driverResult = await client
        .from("drivers")
        .select("id,full_name,email,active")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      if (driverResult.error || !driverResult.data) {
        alert(
          driverResult.error?.message ||
          "No driver record was found for this account."
        );

        return false;
      }

      driver = driverResult.data;
      window.dispatchEvent(
  new CustomEvent("mg-driver-ready", {
    detail: {
      name: driver.full_name,
      email: driver.email
    }
  })
);

      const name = firstName(driver.full_name);
      const greeting = greetingText(new Date());
      document.getElementById("welcomeText").textContent =
        name ? `${greeting}, ${name}` : greeting;

      return true;
    }

    async function loadJobs() {
      activeJobsBox.innerHTML =
        '<div class="empty">Loading assigned jobs…</div>';

      try {
        const result = await client
          .from("quotes")
          .select("*")
          .eq("assigned_driver_id", driver.id)
          .order("created_at", { ascending: false });

        if (result.error) {
          throw result.error;
        }

        jobs = result.data || [];
        renderJobs();

        if (selectedJobId) {
          const current = getSelectedJob(selectedJobId);
          const isRejected = String(current?.driver_acceptance_status || "").toLowerCase() === "rejected";
          const isDelivered = normalizeJobStatus(current) === "delivered";

          if (!current || isRejected || isDelivered) {
            closeJobDetails(true);
          } else {
            renderJobDetailsModal(current);
          }
        }
      } catch (error) {
        const message = escapeHtml(error?.message || "Unable to load jobs.");
        activeJobsBox.innerHTML =
          `<div class="message error">${message}</div>`;
        if (nextSuggestedStopBox) {
          nextSuggestedStopBox.innerHTML = "";
        }
        showToast(error?.message || "Failed to load jobs", "error");
      } finally {
        if (activeJobsBox.innerHTML.includes("Loading assigned jobs")) {
          activeJobsBox.innerHTML = '<div class="empty">No active jobs are currently assigned.</div>';
        }
      }
    }

    async function uploadPhoto(jobId, type, input) {
      const selectedJob = getSelectedJob(jobId);
      if (!selectedJob?.id) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      const file = input.files?.[0];

      if (!file) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        return;
      }

      if (!file.type.startsWith("image/")) {
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(jobId, "Please choose an image.", "error");
        return;
      }

      setModalBusy(true);
      showJobMessage(jobId, "Uploading photo…", "info");

      const extension =
        file.name.split(".").pop()?.toLowerCase() || "jpg";

      const path =
        driver.id + "/" +
        jobId + "/" +
        type + "-" +
        Date.now() + "." +
        extension;

      const uploadResult = await client.storage
        .from("delivery-photos")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadResult.error) {
        setModalBusy(false);
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(
          jobId,
          uploadResult.error.message,
          "error"
        );

        return;
      }

      const publicResult = client.storage
        .from("delivery-photos")
        .getPublicUrl(path);

      const publicUrl = publicResult.data.publicUrl;

      const updateData = type === "pickup"
        ? {
            pickup_photo_url: publicUrl,
            pickup_photo_uploaded_at: new Date().toISOString()
          }
        : {
            delivery_photo_url: publicUrl,
            delivery_photo_uploaded_at: new Date().toISOString()
          };

      const updateResult = await client
        .from("quotes")
        .update(updateData)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (updateResult.error) {
        setModalBusy(false);
        if (pendingPhotoButton) {
          pendingPhotoButton.disabled = false;
          pendingPhotoButton = null;
        }

        showJobMessage(
          jobId,
          updateResult.error.message,
          "error"
        );

        return;
      }

      showJobMessage(jobId, "Photo uploaded successfully.", "info");
      showToast("Photo uploaded", "success");
      await loadJobs();
      setModalBusy(false);

      if (pendingPhotoButton) {
        pendingPhotoButton.disabled = false;
        pendingPhotoButton = null;
      }
    }

    window.uploadPhoto = uploadPhoto;

    function startCountdownTimer() {
      if (countdownTimerId) {
        clearInterval(countdownTimerId);
      }

      countdownTimerId = setInterval(() => {
        renderJobs();
        updateOpenJobCountdown();
      }, 60000);
    }

    async function updateJob(jobId, changes, loadingText, options = {}) {
      const closeOnSuccess = Boolean(options.closeOnSuccess);
      const buttonElement = options.buttonElement || null;
      const successToast = String(options.successToast || "Status updated");
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return false;
      }

      setModalBusy(true);

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      if (loadingText) {
        showJobMessage(jobId, loadingText, "info");
      }

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);

        if (buttonElement) {
          buttonElement.disabled = false;
        }

        showJobMessage(jobId, result.error.message, "error");
        return false;
      }

      await loadJobs();

      if (closeOnSuccess) {
        closeJobDetails(true);
      }

      showToast(successToast, "success");

      setModalBusy(false);

      if (buttonElement) {
        buttonElement.disabled = false;
      }

      return true;
    }

    async function acceptJob(jobId, buttonElement) {
      await updateJob(
        jobId,
        { driver_acceptance_status: "accepted" },
        "Accepting job…",
        {
          buttonElement,
          successToast: "Job accepted"
        }
      );
    }

    window.acceptJob = acceptJob;

    async function rejectJob(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      setModalBusy(true);

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      showJobMessage(jobId, "Rejecting job…", "info");

      try {
        const rejectedAt = new Date().toISOString();

        const result = await client
          .from("quotes")
          .update({
            driver_acceptance_status: "rejected",
            driver_rejected_at: rejectedAt
          })
          .eq("id", selectedJob.id)
          .select()
          .single();

        if (result.error) {
          throw result.error;
        }

        const updatedJob = result.data;

        if (!updatedJob) {
          throw new Error("Reject update returned no row.");
        }

        if (String(updatedJob.driver_acceptance_status || "") !== "rejected") {
          throw new Error("Reject verification failed: driver_acceptance_status is not rejected.");
        }

        console.log("Rejected job returned to dispatch:", updatedJob);

        await loadJobs();
        closeJobDetails(true);
        showToast("Job rejected. Dispatch has been notified.", "success");
      } catch (error) {
        const message = error?.message || "Unable to reject job.";
        showJobMessage(jobId, message, "error");
      } finally {
        setModalBusy(false);

        if (buttonElement) {
          buttonElement.disabled = false;
        }
      }
    }

    window.rejectJob = rejectJob;

    function workflowUpdate(status) {
      return selectedJob => {
        const changes = { status };

        if (usesDriverWorkflowStatus(selectedJob)) {
          changes.driver_workflow_status = workflowStatusForDatabase(status);
        }

        return changes;
      };
    }

    async function markEnRouteToPickup(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      const success = await updateJob(
        jobId,
        workflowUpdate("en_route_to_pickup")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );

      if (success) {
        setLocalWorkflowStage(jobId, "");
      }
    }

    window.markEnRouteToPickup = markEnRouteToPickup;

    function markArrivedAtPickup(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      if (normalizeJobStatus(selectedJob) !== "en_route_to_pickup") {
        return;
      }

      setLocalWorkflowStage(selectedJob.id, "arrived_pickup");

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      renderJobDetailsModal(selectedJob);

      if (buttonElement) {
        buttonElement.disabled = false;
      }

      showToast("Arrival noted. Confirm pickup when ready.", "info");
    }

    window.markArrivedAtPickup = markArrivedAtPickup;

    async function markPickedUp(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      const success = await updateJob(
        jobId,
        workflowUpdate("picked_up")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );

      if (success) {
        setLocalWorkflowStage(jobId, "");
      }
    }

    window.markPickedUp = markPickedUp;

    async function markEnRouteToDelivery(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);
      const success = await updateJob(
        jobId,
        workflowUpdate("en_route_to_delivery")(selectedJob),
        "Updating job status…",
        {
          buttonElement,
          successToast: "Status updated"
        }
      );

      if (success) {
        setLocalWorkflowStage(jobId, "");
      }
    }

    window.markEnRouteToDelivery = markEnRouteToDelivery;

    function markArrivedAtDelivery(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      if (normalizeJobStatus(selectedJob) !== "en_route_to_delivery") {
        return;
      }

      setLocalWorkflowStage(selectedJob.id, "arrived_delivery");

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      renderJobDetailsModal(selectedJob);

      if (buttonElement) {
        buttonElement.disabled = false;
      }

      showToast("Arrival noted. Complete delivery when ready.", "info");
    }

    window.markArrivedAtDelivery = markArrivedAtDelivery;

    async function markDelivered(jobId, buttonElement) {
      const selectedJob = getSelectedJob(jobId);

      if (!selectedJob?.id) {
        showJobMessage(jobId, "Selected job could not be found.", "error");
        return;
      }

      const recipientInput = document.getElementById("podRecipientModal-" + jobId);
      const recipientName = String(recipientInput?.value || "").trim();

      if (!recipientName) {
        showJobMessage(
          jobId,
          "Enter the name of the person who received the delivery.",
          "error"
        );

        return;
      }

      setModalBusy(true);

      if (buttonElement) {
        buttonElement.disabled = true;
      }

      showJobMessage(jobId, "Completing delivery…", "info");

      const podField = podRecipientField(selectedJob);
      const changes = {
        status: "delivered",
        completed_at: new Date().toISOString()
      };

      if (usesDriverWorkflowStatus(selectedJob)) {
        changes.driver_workflow_status = workflowStatusForDatabase("delivered");
      }

      changes[podField] = recipientName;

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", selectedJob.id)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);

        if (buttonElement) {
          buttonElement.disabled = false;
        }

        showJobMessage(jobId, result.error.message, "error");
        return;
      }

      await loadJobs();
      setLocalWorkflowStage(jobId, "");
      closeJobDetails(true);
      showToast("Delivery completed", "success");
      setModalBusy(false);

      if (buttonElement) {
        buttonElement.disabled = false;
      }
    }

    window.markDelivered = markDelivered;

    jobModalClose.addEventListener("click", () => closeJobDetails(false));
    jobModalBackdrop.addEventListener("click", () => closeJobDetails(false));
    routeModalClose.addEventListener("click", closeSuggestedRouteModal);
    routeModalBackdrop.addEventListener("click", closeSuggestedRouteModal);
    viewRouteButton.addEventListener("click", openSuggestedRouteModal);

    document
      .getElementById("refreshButton")
      .addEventListener("click", loadJobs);

    document
      .getElementById("signOutButton")
      .addEventListener("click", async function () {
        this.disabled = true;
        this.textContent = "Signing Out…";

        try {
          await client.auth.signOut();
        } finally {
          localStorage.clear();
          sessionStorage.clear();
          location.replace("/index.html");
        }
      });

    (async function start() {
      const validDriver = await verifyDriver();

      if (validDriver) {
        startCountdownTimer();
        await loadJobs();
      }
    })();
  </script>
<script src="/menu.js"></script></body>
