<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Driver</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --dark: #064f3b;
      --green: #087455;
      --light-green: #e7f5ef;
      --coral: #ff665c;
      --background: #f3f8f6;
      --white: #ffffff;
      --ink: #17221e;
      --muted: #68756f;
      --line: #dfe8e4;
      --danger: #a32d2d;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--dark);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.08;
    }

    .brand span {
      color: var(--coral);
    }

    .driver-email {
      margin-top: 6px;
      font-size: 12px;
      opacity: .82;
      overflow-wrap: anywhere;
    }

    .signout {
      border: 0;
      border-radius: 14px;
      padding: 14px 17px;
      background: white;
      color: var(--dark);
      font-weight: 900;
      min-width: 108px;
    }

    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 28px 18px 60px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 42px;
      line-height: 1.05;
    }

    h2 {
      margin: 0;
      font-size: 28px;
    }

    .earnings {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 13px;
      margin-bottom: 24px;
    }

    .earning-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 19px;
      padding: 19px;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }

    .earning-amount {
      color: var(--green);
      font-size: 29px;
      font-weight: 900;
    }

    .earning-label {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .section {
      margin-top: 30px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .refresh {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      background: white;
      color: var(--dark);
      font-weight: 800;
    }

    .job-list {
      display: grid;
      gap: 18px;
    }

    .compact-job {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
      min-height: 132px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      cursor: pointer;
    }

    .compact-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .compact-job-number {
      color: var(--dark);
      font-size: 20px;
      font-weight: 900;
    }

    .compact-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status {
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--light-green);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .new-badge {
      border-radius: 999px;
      padding: 6px 10px;
      background: #ff665c;
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .compact-route {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .compact-stop {
      font-size: 14px;
      line-height: 1.3;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-stop:last-child {
      text-align: right;
    }

    .compact-arrow {
      color: var(--green);
      font-size: 18px;
      font-weight: 900;
    }

    .compact-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .compact-speed {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .compact-pay {
      color: var(--green);
      font-weight: 900;
      font-size: 20px;
      margin-top: 3px;
    }

    .view-job {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #f7fbf9;
      color: var(--dark);
      font-size: 13px;
      font-weight: 900;
      min-height: 40px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .job-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      align-items: end;
    }

    .job-modal[hidden] {
      display: none;
    }

    .job-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .45);
    }

    .job-modal-sheet {
      position: relative;
      background: white;
      border-radius: 20px 20px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
    }

    .job-modal-close {
      border: 1px solid var(--line);
      background: white;
      color: var(--dark);
      border-radius: 999px;
      width: 38px;
      height: 38px;
      font-weight: 900;
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .modal-title {
      margin: 2px 52px 6px 0;
      color: var(--dark);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
    }

    .modal-status-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .modal-pay {
      margin: 14px 0 4px;
      color: var(--green);
      font-size: 30px;
      font-weight: 900;
    }

    .modal-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .modal-item {
      background: #f8fcfa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
    }

    .modal-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .modal-value {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .modal-section-title {
      color: var(--dark);
      font-size: 18px;
      font-weight: 900;
      margin-top: 16px;
      margin-bottom: 9px;
    }

    .workflow-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .modal-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .action {
      border: 0;
      border-radius: 13px;
      min-height: 48px;
      padding: 11px 14px;
      font-weight: 900;
    }

    .directions {
      background: #edf3f0;
      color: var(--dark);
    }

    .primary {
      background: var(--green);
      color: white;
    }

    .photo-button {
      background: #eef7ff;
      color: #135a82;
    }

    .action:disabled {
      opacity: .48;
      cursor: default;
    }

    .photo-area {
      margin-top: 15px;
      border: 1px dashed #b9c9c2;
      border-radius: 14px;
      padding: 14px;
      background: #fafdfb;
    }

    .photo-area img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 11px;
      margin-top: 11px;
    }

    .photo-status {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .delivery-options {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 1px solid #ccd8d3;
      border-radius: 12px;
      background: white;
      color: var(--ink);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .message {
      margin-top: 14px;
      padding: 13px;
      border-radius: 11px;
      line-height: 1.4;
    }

    .message.info {
      background: #edf7f3;
      color: #06543e;
    }

    .message.error {
      background: #fff0f0;
      color: var(--danger);
    }

    .empty {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .history-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 17px;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .history-pay {
      color: var(--green);
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
    }

    .history-date {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .job-number {
      color: var(--dark);
      font-size: 23px;
      font-weight: 900;
    }

    body.modal-open {
      overflow: hidden;
    }

    @media (max-width: 650px) {
      .earnings {
        grid-template-columns: 1fr 1fr;
      }

      .workflow-grid,
      .button-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }

      .compact-job {
        min-height: 124px;
      }
    }

    @media (min-width: 760px) {
      .job-modal {
        align-items: center;
        justify-items: center;
      }

      .job-modal-sheet {
        width: min(700px, calc(100% - 40px));
        max-height: 88vh;
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div>
      <div class="brand">MG <span>EXPRESS</span> DRIVER</div>
      <div class="driver-email" id="driverEmail"></div>
    </div>

    <button class="signout" id="signOutButton" type="button">
      Sign Out
    </button>
  </header>

  <main class="container">
    <div class="eyebrow" id="welcomeText">Driver mobile portal</div>
    <h1>My Jobs</h1>

    <section class="earnings">
      <div class="earning-card">
        <div class="earning-amount" id="todayEarnings">$0.00</div>
        <div class="earning-label">Today</div>
      </div>

      <div class="earning-card">
        <div class="earning-amount" id="weekEarnings">$0.00</div>
        <div class="earning-label">This Week</div>
      </div>

      <div class="earning-card">
        <div class="earning-amount" id="monthEarnings">$0.00</div>
        <div class="earning-label">This Month</div>
      </div>

      <div class="earning-card">
        <div class="earning-amount" id="activeCount">0</div>
        <div class="earning-label">Active Jobs</div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Assigned Jobs</h2>

        <button class="refresh" id="refreshButton" type="button">
          Refresh
        </button>
      </div>

      <div id="activeJobs" class="job-list">
        <div class="empty">Loading assigned jobs…</div>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h2>Completed Jobs</h2>
      </div>

      <div id="completedJobs" class="job-list">
        <div class="empty">Loading completed jobs…</div>
      </div>
    </section>
  </main>

  <div id="jobModal" class="job-modal" hidden>
    <div id="jobModalBackdrop" class="job-modal-backdrop"></div>

    <div class="job-modal-sheet" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
      <button id="jobModalClose" class="job-modal-close" type="button" aria-label="Close job details">
        X
      </button>

      <div id="jobModalContent"></div>
    </div>
  </div>

  <script>
    const client = supabase.createClient(
  "https://dczlucwfjayymlwbzzdi.supabase.co",
  "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
);

window.mgSupabaseClient = client;

    const activeJobsBox = document.getElementById("activeJobs");
    const completedJobsBox = document.getElementById("completedJobs");
    const jobModal = document.getElementById("jobModal");
    const jobModalContent = document.getElementById("jobModalContent");
    const jobModalBackdrop = document.getElementById("jobModalBackdrop");
    const jobModalClose = document.getElementById("jobModalClose");

    let currentSession = null;
    let driver = null;
    let jobs = [];
    let activeModalJobId = null;
    let modalBusy = false;

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }

    function money(value) {
      return Number(value || 0).toLocaleString("en-US", {
        style: "currency",
        currency: "USD"
      });
    }

    function statusLabel(status) {
      const labels = {
        assigned: "Assigned",
        arrived_at_pickup: "Arrived at Pickup",
        en_route_to_pickup: "En Route to Pickup",
        picked_up: "Picked Up",
        arrived_at_delivery: "Arrived at Delivery",
        en_route_to_delivery: "En Route to Delivery",
        new: "Assigned",
        waiting_payment: "Waiting",
        paid: "Ready",
        ready: "Ready",
        in_transit: "In Transit",
        delivered: "Delivered",
        cancelled: "Cancelled"
      };

      return labels[status] ||
        String(status || "").replaceAll("_", " ");
    }

    function normalizeJobStatus(job) {
      const status = String(job?.status || "assigned").toLowerCase();

      if (status === "new") return "assigned";
      if (status === "in_transit") return "en_route_to_delivery";

      return status;
    }

    function hasAccepted(job) {
      return String(job.driver_acceptance_status || "").toLowerCase() === "accepted";
    }

    function formatDate(value) {
      if (!value) return "";

      return new Date(value).toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function beginningOfToday() {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function beginningOfWeek() {
      const date = beginningOfToday();
      const day = date.getDay();
      const difference = day === 0 ? 6 : day - 1;
      date.setDate(date.getDate() - difference);
      return date;
    }

    function beginningOfMonth() {
      const date = beginningOfToday();
      date.setDate(1);
      return date;
    }

    function completedDate(job) {
      return new Date(job.completed_at || job.created_at);
    }

    function updateEarnings() {
      const delivered = jobs.filter(job => job.status === "delivered");

      const totalSince = start =>
        delivered
          .filter(job => completedDate(job) >= start)
          .reduce((sum, job) => sum + Number(job.driver_pay || 0), 0);

      document.getElementById("todayEarnings").textContent =
        money(totalSince(beginningOfToday()));

      document.getElementById("weekEarnings").textContent =
        money(totalSince(beginningOfWeek()));

      document.getElementById("monthEarnings").textContent =
        money(totalSince(beginningOfMonth()));

      document.getElementById("activeCount").textContent =
        jobs.filter(job =>
          !["delivered", "cancelled"].includes(job.status)
        ).length;
    }

    function mapLink(address) {
      return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(address || "");
    }

    function fieldValue(job, keys) {
      for (const key of keys) {
        const value = job?.[key];

        if (value !== null && value !== undefined && String(value).trim() !== "") {
          return String(value).trim();
        }
      }

      return "";
    }

    function shortAddress(address) {
      const value = String(address || "").trim();
      if (!value) return "Address not available";

      const compact = value
        .split(",")
        .map(part => part.trim())
        .filter(Boolean)
        .slice(0, 2)
        .join(", ");

      if (compact.length <= 34) return compact;
      return compact.slice(0, 31) + "...";
    }

    function locationSummary(job, prefix) {
      const city = fieldValue(job, [
        prefix + "_city",
        prefix + "City"
      ]);

      const zip = fieldValue(job, [
        prefix + "_zip",
        prefix + "_postal_code",
        prefix + "_postcode"
      ]);

      if (city && zip) return city + " " + zip;
      if (city) return city;
      if (zip) return "ZIP " + zip;

      return shortAddress(job[prefix + "_address"]);
    }

    function scheduledTimestamp(job) {
      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at",
        "created_at"
      ]);

      const value = source ? Date.parse(source) : 0;
      return Number.isFinite(value) ? value : 0;
    }

    function deliverySpeedOrTime(job) {
      if (job.delivery_speed) {
        return String(job.delivery_speed);
      }

      const source = fieldValue(job, [
        "pickup_time",
        "pickup_at",
        "scheduled_pickup_at",
        "scheduled_at",
        "requested_pickup_at"
      ]);

      if (source) {
        return "Scheduled " + formatDate(source);
      }

      return "Standard";
    }

    function photoInput(jobId, type) {
      return `
        <input
          id="${type}File-${jobId}"
          type="file"
          accept="image/*"
          capture="environment"
          hidden
          onchange="uploadPhoto('${jobId}','${type}',this)"
        >
      `;
    }

    function podRecipientField(job) {
      if (Object.prototype.hasOwnProperty.call(job, "pod_recipient_name")) {
        return "pod_recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "recipient_name")) {
        return "recipient_name";
      }

      if (Object.prototype.hasOwnProperty.call(job, "delivery_recipient_name")) {
        return "delivery_recipient_name";
      }

      return "pod_recipient_name";
    }

    function podRecipientValue(job) {
      return String(
        job.pod_recipient_name ||
        job.recipient_name ||
        job.delivery_recipient_name ||
        ""
      ).trim();
    }

    function acceptancePending(job) {
      const value = String(job.driver_acceptance_status || "").toLowerCase();
      return !value || value === "pending";
    }

    function workflowState(job) {
      const status = normalizeJobStatus(job);

      if (status === "assigned" && acceptancePending(job)) {
        return "pending";
      }

      if (status === "assigned" && hasAccepted(job)) {
        return "accepted";
      }

      if (["en_route_to_pickup", "arrived_at_pickup"].includes(status)) {
        return "pickup_phase";
      }

      if (status === "picked_up") {
        return "picked_up";
      }

      if (["en_route_to_delivery", "arrived_at_delivery"].includes(status)) {
        return "delivery_phase";
      }

      return "other";
    }

    function renderPhotoArea(job, type) {
      const isPickup = type === "pickup";
      const url = isPickup
        ? job.pickup_photo_url
        : job.delivery_photo_url;

      const time = isPickup
        ? job.pickup_photo_uploaded_at
        : job.delivery_photo_uploaded_at;

      const title = isPickup
        ? "Pickup Photo"
        : "Delivery Photo";

      return `
        <div class="photo-area">
          <strong>${title}</strong>

          <div class="photo-status">
            ${
              url
                ? "Uploaded " + escapeHtml(formatDate(time))
                : "Photo required"
            }
          </div>

          ${
            url
              ? `<a href="${escapeHtml(url)}" target="_blank">
                   <img src="${escapeHtml(url)}" alt="${title}">
                 </a>`
              : ""
          }
        </div>
      `;
    }

    function compactJobCard(job) {
      const status = normalizeJobStatus(job);
      const isNew = status === "assigned" && acceptancePending(job);

      return `
        <article
          class="compact-job"
          role="button"
          tabindex="0"
          onclick="openJobDetails('${job.id}')"
          onkeydown="if(event.key==='Enter' || event.key===' '){event.preventDefault();openJobDetails('${job.id}');}"
        >
          <div class="compact-top">
            <div class="compact-job-number">
              ${escapeHtml(job.job_number)}
            </div>

            <div class="compact-badges">
              <div class="status">
                ${escapeHtml(statusLabel(status))}
              </div>

              ${isNew ? '<div class="new-badge">NEW</div>' : ""}
            </div>
          </div>

          <div class="compact-route">
            <div class="compact-stop" title="${escapeHtml(job.pickup_address || "")}">
              ${escapeHtml(locationSummary(job, "pickup"))}
            </div>

            <div class="compact-arrow">-></div>

            <div class="compact-stop" title="${escapeHtml(job.delivery_address || "")}">
              ${escapeHtml(locationSummary(job, "delivery"))}
            </div>
          </div>

          <div class="compact-meta">
            <div>
              <div class="compact-speed">${escapeHtml(deliverySpeedOrTime(job))}</div>
              <div class="compact-pay">${money(job.driver_pay)}</div>
            </div>

            <button
              class="view-job"
              type="button"
              onclick="event.stopPropagation();openJobDetails('${job.id}')"
            >
              View Job
            </button>
          </div>
        </article>
      `;
    }

    function safeText(value, fallback = "Not provided") {
      const text = String(value || "").trim();
      return text || fallback;
    }

    function workflowButtonsInModal(job) {
      const state = workflowState(job);

      if (state === "pending") {
        return `
          <button class="action primary" type="button" onclick="acceptJob('${job.id}')">Accept Job</button>
          <button class="action directions" type="button" onclick="rejectJob('${job.id}')">Reject Job</button>
        `;
      }

      if (state === "accepted") {
        return `
          <button class="action primary" type="button" onclick="markEnRouteToPickup('${job.id}')">En Route to Pickup</button>
        `;
      }

      if (state === "pickup_phase") {
        return `
          <button class="action directions" type="button" onclick="markArrivedAtPickup('${job.id}')">Arrived at Pickup</button>
          <button class="action primary" type="button" onclick="markPickedUp('${job.id}')">Picked Up</button>
        `;
      }

      if (state === "picked_up") {
        return `
          <button class="action primary" type="button" onclick="markEnRouteToDelivery('${job.id}')">En Route to Delivery</button>
        `;
      }

      if (state === "delivery_phase") {
        return `
          <button class="action directions" type="button" onclick="markArrivedAtDelivery('${job.id}')">Arrived at Delivery</button>
          <button class="action primary" type="button" onclick="markDelivered('${job.id}')">Delivered</button>
        `;
      }

      return '<div class="modal-note">No workflow actions available.</div>';
    }

    function renderJobDetailsModal(job) {
      const status = normalizeJobStatus(job);
      const state = workflowState(job);
      const showPickupControls = ["pickup_phase", "picked_up", "delivery_phase"].includes(state);
      const showDeliveryControls = state === "delivery_phase";
      const notesForDriver = fieldValue(job, ["driver_notes", "special_instructions"]);
      const pickupSuite = fieldValue(job, ["pickup_suite", "pickup_floor", "pickup_unit", "pickup_suite_floor"]);
      const deliverySuite = fieldValue(job, ["delivery_suite", "delivery_floor", "delivery_unit", "delivery_suite_floor"]);
      const pickupZip = fieldValue(job, ["pickup_zip", "pickup_postal_code", "pickup_postcode"]);
      const deliveryZip = fieldValue(job, ["delivery_zip", "delivery_postal_code", "delivery_postcode"]);

      jobModalContent.innerHTML = `
        <h3 id="jobModalTitle" class="modal-title">${escapeHtml(job.job_number)}</h3>

        <div class="modal-status-row">
          <div class="status">${escapeHtml(statusLabel(status))}</div>
          ${status === "assigned" && acceptancePending(job) ? '<div class="new-badge">NEW</div>' : ""}
        </div>

        <div class="modal-label">Driver Pay</div>
        <div class="modal-pay">${money(job.driver_pay)}</div>

        <div class="modal-grid">
          <div class="modal-item"><div class="modal-label">Customer Name</div><div class="modal-value">${escapeHtml(safeText(job.customer_name, "Customer"))}</div></div>
          <div class="modal-item"><div class="modal-label">Full Pickup Address</div><div class="modal-value">${escapeHtml(safeText(job.pickup_address))}</div></div>
          <div class="modal-item"><div class="modal-label">Pickup Suite/Floor</div><div class="modal-value">${escapeHtml(safeText(pickupSuite))}</div></div>
          <div class="modal-item"><div class="modal-label">Pickup ZIP</div><div class="modal-value">${escapeHtml(safeText(pickupZip))}</div></div>
          <div class="modal-item"><div class="modal-label">Full Delivery Address</div><div class="modal-value">${escapeHtml(safeText(job.delivery_address))}</div></div>
          <div class="modal-item"><div class="modal-label">Delivery Suite/Floor</div><div class="modal-value">${escapeHtml(safeText(deliverySuite))}</div></div>
          <div class="modal-item"><div class="modal-label">Delivery ZIP</div><div class="modal-value">${escapeHtml(safeText(deliveryZip))}</div></div>
          <div class="modal-item"><div class="modal-label">Delivery Recipient Name</div><div class="modal-value">${escapeHtml(safeText(podRecipientValue(job)))}</div></div>
          <div class="modal-item"><div class="modal-label">Delivery Speed</div><div class="modal-value">${escapeHtml(safeText(job.delivery_speed, deliverySpeedOrTime(job)))}</div></div>
          <div class="modal-item"><div class="modal-label">Package Type</div><div class="modal-value">${escapeHtml(safeText(job.package_type))}</div></div>
          <div class="modal-item"><div class="modal-label">Dispatch Notes for Driver</div><div class="modal-value">${escapeHtml(safeText(notesForDriver))}</div></div>
        </div>

        <div class="modal-section-title">Directions</div>
        <div class="button-grid">
          <button class="action directions" type="button" onclick="window.open('${mapLink(job.pickup_address)}','_blank')">Pickup Directions</button>
          <button class="action directions" type="button" onclick="window.open('${mapLink(job.delivery_address)}','_blank')">Delivery Directions</button>
        </div>

        <div class="modal-section-title">Workflow</div>
        <div class="workflow-grid">
          ${workflowButtonsInModal(job)}
        </div>

        ${showPickupControls ? `
          <div class="modal-section-title">Pickup Photo</div>
          ${photoInput(job.id, "pickup")}
          <div class="button-grid">
            <button class="action photo-button" type="button" onclick="document.getElementById('pickupFile-${job.id}').click()">
              ${job.pickup_photo_url ? "Replace Pickup Photo" : "Take Pickup Photo"}
            </button>
          </div>
          ${renderPhotoArea(job, "pickup")}
        ` : ""}

        ${showDeliveryControls ? `
          <div class="modal-section-title">Delivery Proof</div>
          ${photoInput(job.id, "delivery")}
          <div class="button-grid">
            <button class="action photo-button" type="button" onclick="document.getElementById('deliveryFile-${job.id}').click()">
              ${job.delivery_photo_url ? "Replace Delivery Photo" : "Take Delivery Photo"}
            </button>
          </div>

          <div class="delivery-options">
            <label>
              POD Recipient Name
              <input
                id="podRecipientModal-${job.id}"
                type="text"
                value="${escapeHtml(podRecipientValue(job))}"
                placeholder="Enter recipient name if no delivery photo"
              >
            </label>
          </div>

          ${renderPhotoArea(job, "delivery")}
          <div class="modal-note">Delivered requires delivery photo or POD recipient name.</div>
        ` : ""}

        <div id="message-${job.id}"></div>
      `;
    }

    function openJobDetails(jobId) {
      const job = jobs.find(item => item.id === jobId);
      if (!job) return;

      activeModalJobId = jobId;
      renderJobDetailsModal(job);
      jobModal.hidden = false;
      document.body.classList.add("modal-open");
    }

    window.openJobDetails = openJobDetails;

    function closeJobDetails(force = false) {
      if (modalBusy && !force) return;

      activeModalJobId = null;
      jobModal.hidden = true;
      document.body.classList.remove("modal-open");
      jobModalContent.innerHTML = "";
    }

    function setModalBusy(isBusy) {
      modalBusy = isBusy;

      if (jobModal) {
        jobModal.setAttribute("aria-busy", String(isBusy));
      }
    }

    function activeJobsSorted() {
      return jobs
        .filter(job => {
          const status = normalizeJobStatus(job);
          const acceptance = String(job.driver_acceptance_status || "").toLowerCase();

          return !["delivered", "cancelled"].includes(status) && acceptance !== "rejected";
        })
        .sort((left, right) => {
          const leftPending = acceptancePending(left) && normalizeJobStatus(left) === "assigned";
          const rightPending = acceptancePending(right) && normalizeJobStatus(right) === "assigned";

          if (leftPending !== rightPending) {
            return leftPending ? -1 : 1;
          }

          if (leftPending && rightPending) {
            const leftCreated = Date.parse(left.created_at || 0) || 0;
            const rightCreated = Date.parse(right.created_at || 0) || 0;
            return rightCreated - leftCreated;
          }

          const leftPickup = scheduledTimestamp(left);
          const rightPickup = scheduledTimestamp(right);

          if (leftPickup !== rightPickup) {
            return leftPickup - rightPickup;
          }

          const leftCreated = Date.parse(left.created_at || 0) || 0;
          const rightCreated = Date.parse(right.created_at || 0) || 0;
          return rightCreated - leftCreated;
        });
    }

    function renderJobs() {
      updateEarnings();

      const active = activeJobsSorted();

      const completed = jobs
        .filter(job => normalizeJobStatus(job) === "delivered")
        .slice(0, 30);

      activeJobsBox.innerHTML = active.length
        ? active.map(compactJobCard).join("")
        : '<div class="empty">No active jobs are currently assigned.</div>';

      completedJobsBox.innerHTML = completed.length
        ? completed.map(job => `
            <article class="history-card">
              <div class="history-row">
                <div>
                  <div class="job-number">
                    ${escapeHtml(job.job_number)}
                  </div>

                  <div>
                    ${escapeHtml(job.customer_name || "Customer")}
                  </div>

                  <div class="history-date">
                    ${escapeHtml(formatDate(job.completed_at))}
                  </div>
                </div>

                <div class="history-pay">
                  ${money(job.driver_pay)}
                </div>
              </div>
            </article>
          `).join("")
        : '<div class="empty">No completed jobs yet.</div>';
    }

    function showJobMessage(jobId, text, type) {
      const box = document.getElementById("message-" + jobId);

      if (!box) return;

      box.className = "message " + type;
      box.textContent = text;
    }

    async function verifyDriver() {
      const sessionResult = await client.auth.getSession();
      currentSession = sessionResult.data.session;

      if (!currentSession) {
        location.replace("/index.html");
        return false;
      }

      document.getElementById("driverEmail").textContent =
        currentSession.user.email || "";

      const profileResult = await client
        .from("profiles")
        .select("role,full_name")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      const role = String(
        profileResult.data?.role || ""
      ).toLowerCase();

      if (role !== "driver") {
        await client.auth.signOut();
        location.replace("/index.html");
        return false;
      }

      const driverResult = await client
        .from("drivers")
        .select("id,full_name,email,active")
        .eq("id", currentSession.user.id)
        .maybeSingle();

      if (driverResult.error || !driverResult.data) {
        alert(
          driverResult.error?.message ||
          "No driver record was found for this account."
        );

        return false;
      }

      driver = driverResult.data;
      window.dispatchEvent(
  new CustomEvent("mg-driver-ready", {
    detail: {
      name: driver.full_name,
      email: driver.email
    }
  })
);

      document.getElementById("welcomeText").textContent =
        "Welcome, " + (driver.full_name || "Driver");

      return true;
    }

    async function loadJobs() {
      activeJobsBox.innerHTML =
        '<div class="empty">Loading assigned jobs…</div>';

      const result = await client
        .from("quotes")
        .select("*")
        .eq("assigned_driver_id", driver.id)
        .order("created_at", { ascending: false });

      if (result.error) {
        activeJobsBox.innerHTML =
          `<div class="message error">${escapeHtml(result.error.message)}</div>`;

        return;
      }

      jobs = result.data || [];
      renderJobs();

      if (activeModalJobId) {
        const current = jobs.find(item => item.id === activeModalJobId);
        const isRejected = String(current?.driver_acceptance_status || "").toLowerCase() === "rejected";
        const isDelivered = normalizeJobStatus(current) === "delivered";

        if (!current || isRejected || isDelivered) {
          closeJobDetails(true);
        } else {
          renderJobDetailsModal(current);
        }
      }
    }

    async function uploadPhoto(jobId, type, input) {
      const file = input.files?.[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showJobMessage(jobId, "Please choose an image.", "error");
        return;
      }

      setModalBusy(true);
      showJobMessage(jobId, "Uploading photo…", "info");

      const extension =
        file.name.split(".").pop()?.toLowerCase() || "jpg";

      const path =
        driver.id + "/" +
        jobId + "/" +
        type + "-" +
        Date.now() + "." +
        extension;

      const uploadResult = await client.storage
        .from("delivery-photos")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadResult.error) {
        setModalBusy(false);
        showJobMessage(
          jobId,
          uploadResult.error.message,
          "error"
        );

        return;
      }

      const publicResult = client.storage
        .from("delivery-photos")
        .getPublicUrl(path);

      const publicUrl = publicResult.data.publicUrl;

      const updateData = type === "pickup"
        ? {
            pickup_photo_url: publicUrl,
            pickup_photo_uploaded_at: new Date().toISOString()
          }
        : {
            delivery_photo_url: publicUrl,
            delivery_photo_uploaded_at: new Date().toISOString()
          };

      const updateResult = await client
        .from("quotes")
        .update(updateData)
        .eq("id", jobId)
        .eq("assigned_driver_id", driver.id);

      if (updateResult.error) {
        setModalBusy(false);
        showJobMessage(
          jobId,
          updateResult.error.message,
          "error"
        );

        return;
      }

      showJobMessage(jobId, "Photo uploaded successfully.", "info");
      await loadJobs();
      setModalBusy(false);
    }

    window.uploadPhoto = uploadPhoto;

    async function updateJob(jobId, changes, loadingText, options = {}) {
      const closeOnSuccess = Boolean(options.closeOnSuccess);

      setModalBusy(true);

      if (loadingText) {
        showJobMessage(jobId, loadingText, "info");
      }

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", jobId)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);
        showJobMessage(jobId, result.error.message, "error");
        return false;
      }

      await loadJobs();

      if (closeOnSuccess) {
        closeJobDetails(true);
      }

      setModalBusy(false);
      return true;
    }

    async function acceptJob(jobId) {
      await updateJob(
        jobId,
        { driver_acceptance_status: "accepted" },
        "Accepting job…"
      );
    }

    window.acceptJob = acceptJob;

    async function rejectJob(jobId) {
      await updateJob(
        jobId,
        { driver_acceptance_status: "rejected" },
        "Rejecting job…",
        { closeOnSuccess: true }
      );
    }

    window.rejectJob = rejectJob;

    async function markEnRouteToPickup(jobId) {
      await updateJob(
        jobId,
        { status: "en_route_to_pickup" },
        "Updating job status…"
      );
    }

    window.markEnRouteToPickup = markEnRouteToPickup;

    async function markArrivedAtPickup(jobId) {
      await updateJob(
        jobId,
        { status: "arrived_at_pickup" },
        "Updating job status…"
      );
    }

    window.markArrivedAtPickup = markArrivedAtPickup;

    async function markPickedUp(jobId) {
      await updateJob(
        jobId,
        { status: "picked_up" },
        "Updating job status…"
      );
    }

    window.markPickedUp = markPickedUp;

    async function markEnRouteToDelivery(jobId) {
      await updateJob(
        jobId,
        { status: "en_route_to_delivery" },
        "Updating job status…"
      );
    }

    window.markEnRouteToDelivery = markEnRouteToDelivery;

    async function markArrivedAtDelivery(jobId) {
      await updateJob(
        jobId,
        { status: "arrived_at_delivery" },
        "Updating job status…"
      );
    }

    window.markArrivedAtDelivery = markArrivedAtDelivery;

    async function markDelivered(jobId) {
      const job = jobs.find(item => item.id === jobId);
      const recipientInput = document.getElementById("podRecipientModal-" + jobId);
      const recipientName = String(recipientInput?.value || "").trim();
      const hasPhoto = Boolean(job?.delivery_photo_url);

      if (!hasPhoto && !recipientName) {
        showJobMessage(
          jobId,
          "Provide either a delivery photo or POD recipient name.",
          "error"
        );

        return;
      }

      setModalBusy(true);
      showJobMessage(jobId, "Completing delivery…", "info");

      const podField = podRecipientField(job);
      const changes = {
        status: "delivered",
        completed_at: new Date().toISOString()
      };

      if (recipientName) {
        changes[podField] = recipientName;
      }

      const result = await client
        .from("quotes")
        .update(changes)
        .eq("id", jobId)
        .eq("assigned_driver_id", driver.id);

      if (result.error) {
        setModalBusy(false);
        showJobMessage(jobId, result.error.message, "error");
        return;
      }

      await loadJobs();
      closeJobDetails(true);
      setModalBusy(false);
    }

    window.markDelivered = markDelivered;

    jobModalClose.addEventListener("click", () => closeJobDetails(false));
    jobModalBackdrop.addEventListener("click", () => closeJobDetails(false));

    document
      .getElementById("refreshButton")
      .addEventListener("click", loadJobs);

    document
      .getElementById("signOutButton")
      .addEventListener("click", async function () {
        this.disabled = true;
        this.textContent = "Signing Out…";

        try {
          await client.auth.signOut();
        } finally {
          localStorage.clear();
          sessionStorage.clear();
          location.replace("/index.html");
        }
      });

    (async function start() {
      const validDriver = await verifyDriver();

      if (validDriver) {
        await loadJobs();
      }
    })();
  </script>
<script src="/menu.js"></script></body>
</html>
