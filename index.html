<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MG Express Driver Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --green-dark: #064f3b;
      --green: #087455;
      --ink: #202824;
      --muted: #68746f;
      --danger: #9b2929;
    }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background-color: #263c34;
      background-image:
        linear-gradient(rgba(13, 27, 22, .22), rgba(13, 27, 22, .30)),
        url("https://migenteexpress.com/assets/mg-express-night-mural-team.webp");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .login-card {
      width: min(70vw, 300px);
      padding: 10px 16px 11px;
      background: #fff;
      border-radius: 23px;
      box-shadow: 0 20px 65px rgba(0, 0, 0, .24);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 4px;
    }

    .logo {
      display: block;
      width: 118px;
      height: auto;
      max-height: 96px;
      object-fit: contain;
    }

    .portal-label {
      margin: 0 0 6px;
      color: var(--green-dark);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 500;
    }

    input {
      display: block;
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid #cdd4d4;
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 116, 85, .14);
    }

    .field { margin-bottom: 8px; }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 65px; }

    .show-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 8px 6px;
      border: 0;
      background: transparent;
      font-size: 12px;
      color: var(--green-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .sign-in {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      min-height: 45px;
      margin-top: 2px;
      padding: 8px 18px;
      border: 1.5px solid var(--green);
      border-radius: 10px;
      background: #fff;
      color: var(--green);
      font: inherit;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: color .15s ease, background .15s ease;
    }

    .sign-in:hover,
    .sign-in:focus-visible {
      background: var(--green);
      color: #fff;
    }

    .sign-in:disabled { opacity: .65; cursor: default; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .message.info { display: block; background: #eaf7f0; color: #07583f; }
    .message.error { display: block; background: #fff0f0; color: var(--danger); }

    .help {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        background-image:
          linear-gradient(rgba(13, 27, 22, .20), rgba(13, 27, 22, .29)),
          url("https://migenteexpress.com/assets/field-photo-01-v2.jpg");
        background-position: center center;
        background-attachment: scroll;
      }
      .login-card {
        width: min(65vw, 265px);
        padding: 8px 14px 9px;
      }
      .logo { width: 106px; }
    }

    @media (max-height: 640px) {
      body { padding-top: 18px; padding-bottom: 18px; }
      .login-card { padding-top: 10px; padding-bottom: 11px; }
      .logo { width: 115px; }
      .portal-label { margin-bottom: 15px; }
      .subtitle { margin-bottom: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sign-in { transition: none; }
    }
  </style>
</head>


<body>
  <main class="login-card">
    <div class="logo-wrap">
      <img
        class="logo"
        src="https://migenteexpress.com/assets/mg-express-logo-2026.jpg"
        alt="MG Express"
      >
    </div>

    <p class="portal-label">Driver Portal</p>
    <h1>Login</h1>
    <p class="subtitle">Sign in to view your deliveries and earnings.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
          <button
            class="show-password"
            id="showPasswordButton"
            type="button"
            aria-label="Show password"
          >Show</button>
        </div>
      </div>

      <button
        class="sign-in"
        id="signInButton"
        type="submit"
      >Sign In</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p class="help">Need access? Contact MG Express Dispatch.</p>
  </main>

  <script>
    const client = supabase.createClient(
      "https://dczlucwfjayymlwbzzdi.supabase.co",
      "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
    );

    const loginForm =
      document.getElementById("loginForm");

    const signInButton =
      document.getElementById("signInButton");

    const message =
      document.getElementById("message");

    const passwordInput =
      document.getElementById("password");

    const showPasswordButton =
      document.getElementById("showPasswordButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function resetButton() {
      signInButton.disabled = false;
      signInButton.textContent = "Sign In";
    }

    async function verifyDriver(userId) {
      const profileResult = await client
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .maybeSingle();

      if (
        profileResult.error ||
        !profileResult.data
      ) {
        await client.auth.signOut();

        showMessage(
          profileResult.error?.message ||
          "No MG Express profile was found for this account.",
          "error"
        );

        resetButton();
        return;
      }

      const role = String(
        profileResult.data.role || ""
      ).toLowerCase();

      if (role !== "driver") {
        await client.auth.signOut();

        showMessage(
          "This account does not have driver access. Use the correct MG Express portal.",
          "error"
        );

        resetButton();
        return;
      }

      location.replace("/driver.html");
    }

    loginForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        signInButton.disabled = true;
        signInButton.textContent = "Signing In…";

        showMessage(
          "Checking your driver account…",
          "info"
        );

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          passwordInput.value;

        const result =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (result.error) {
          showMessage(
            result.error.message,
            "error"
          );

          resetButton();
          return;
        }

        await verifyDriver(
          result.data.user.id
        );
      }
    );

    showPasswordButton.addEventListener(
      "click",
      function () {
        const showing =
          passwordInput.type === "text";

        passwordInput.type =
          showing ? "password" : "text";

        showPasswordButton.textContent =
          showing ? "Show" : "Hide";
      }
    );

    async function checkExistingSession() {
      const result =
        await client.auth.getSession();

      const session =
        result.data.session;

      if (session) {
        showMessage(
          "Opening your driver dashboard…",
          "info"
        );

        await verifyDriver(
          session.user.id
        );
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
